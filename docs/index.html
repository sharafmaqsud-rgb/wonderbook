const POS=['amazing','incredible','loved','love','best','beautiful','favourite','favorite','great','fantastic','delicious','stunning','wonderful','perfect','unreal','brilliant','awesome','gorgeous','friendly','fun','lovely','excellent','unforgettable','magical','highlight','good','nice','tasty','cheap','safe','easy','clean','welcoming','vibrant','buzzing','special','enjoyed','happy','impressive','breathtaking'];
const STRONG=['amazing','incredible','best','unreal','perfect','unforgettable','magical','stunning','fantastic','loved','favourite','favorite','brilliant','gorgeous','excellent','breathtaking'];
const NEG=['bad','terrible','awful','worst','boring','dirty','expensive','overpriced','rude','unsafe','dangerous','disappointing','disappointed','crowded','touristy','hate','hated','sketchy','slow','confusing','bland','dull','scam','dodgy','rough','stressful','pricey','tiring','underwhelming'];
const CATWORDS={live:['live here','living here','move here','could live','would live','wouldn\'t live','couldn\'t live','settle here','livable','liveable'],
  food:['food','ate','eat','eating','restaurant','meal','dinner','lunch','breakfast','cuisine','dish','coffee','tapas','sushi','pizza','pasta','wine','beer','bakery','market'],
  people:['people','locals','everyone','strangers','host','guide'],
  sights:['museum','cathedral','temple','castle','tower','monument','palace','landmark','attraction','sights','sightseeing','old town','architecture','gallery','stadium'],
  nature:['beach','mountain','hike','hiking','park','lake','river','sunset','sunrise','nature','view','views','island','sea','ocean','forest','waterfall','coast'],
  nightlife:['nightlife','bar','bars','club','clubs','night out','party','pub','pubs','live music'],
  value:['cheap','expensive','price','prices','value','affordable','overpriced','cost','pricey','budget'],
  safety:['safe','safety','unsafe','dangerous','sketchy','pickpocket','dodgy'],
  transport:['metro','train','trains','bus','buses','tram','subway','taxi','uber','walkable','transport','getting around','traffic'],
  vibe:['vibe','atmosphere','energy','buzz','charm','character']};
const TAGWORDS={'Food':CATWORDS.food,'People':['met','friend','friends','locals','family','together'],
  'Sport & events':['match','game','stadium','football','soccer','basketball','rugby','cricket','tennis','grand prix','race','concert','festival','gig','derby','tournament','final','fans'],
  'Nature':['beach','mountain','hike','hiking','lake','sunset','sunrise','nature','island','ocean','forest','waterfall','coast'],'Culture':['museum','temple','cathedral','church','history','historic','art','gallery','architecture','tradition','old town','culture','mosque','palace'],
  'Nightlife':CATWORDS.nightlife,'Adventure':['hike','climb','dive','diving','surf','surfing','kayak','trek','cycling','rafting','snorkel','ski','skiing','adventure','zipline']};
const hasWord=(low,w)=>new RegExp('(^|[^a-z])'+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'($|[^a-z])').test(low);
function sentiment(low){let s=0;for(const w of POS)if(hasWord(low,w))s+=STRONG.includes(w)?2:1;for(const w of NEG)if(hasWord(low,w))s-=1;
  if(s>0&&/(^|[^a-z])(not|never|wasn't|isn't|weren't|aren't|didn't|don't)($|[^a-z])/.test(low))s=-1;return s}
const FILL=/\b(u+m+|u+h+|e+r+m*|you know|i mean|basically|literally|honestly|to be honest|sort of|i guess|like i said)\b,?\s*/gi;
const TAKE_RE=/(^|[^a-z])(next time|should|shouldn't|recommend|tip|tips|learned|learnt|avoid|worth|need to|wish|make sure|go back|if you|book ahead|in advance|don't bother|skip)($|[^a-z])/;
function sentences(text){const clean=text.replace(FILL,'').replace(/\s+/g,' ').trim();
  let parts=clean.split(/(?<=[.!?])\s+|\n+/);
  parts=parts.flatMap(p=>p.split(' ').length>26?p.split(/,?\s+(?:and then|and after that|after that|and also|then we|then i|but then)\s+/i):[p]);
  return parts.map(p=>p.trim().replace(/^(so|and|well|okay|ok|but|also|then|anyway|yeah|oh)[, ]+/i,'')).filter(p=>p.split(' ').length>=3).map(p=>p.charAt(0).toUpperCase()+p.slice(1))}
const clip=(s,n)=>{const w=s.replace(/[.!?]+$/,'').split(' ');return w.length<=n?w.join(' '):w.slice(0,n).join(' ').replace(/[,;:]$/,'')+'…'};
/* One spoken thought, tidied into a short point for a sticky note. */
function point(s){let t=s.trim().replace(/^(and|but|so|also|then)\s+/i,'').replace(/^(i think|i thought|i feel like|i felt like|we thought|i would say|i'd say|it was just)[, ]+/i,'')
    .replace(/^(the |my |our )?(best|favourite|favorite|worst|coolest|funniest) (moment|part|bit|thing|memory)( of (the|our|my) \w+)? (was|is) (definitely |probably )?(that |when |how )?/i,'');
  return clip(t.charAt(0).toUpperCase()+t.slice(1),14)}
function tipPoint(s){const t=s.replace(/^next time[, ]+/i,'').replace(/^((i|we|you)('d| would)? (should|need to|have to|must)( definitely| really)?|i('d| would) (definitely )?recommend|make sure( to| you)?|remember to|definitely)\s+/i,'');return point(t)}
/* Spoken sentences run several thoughts together; split them where a new one starts. */
function clauses(s){const sub='(?:we|i|the|it|they|my|our|there|that|this|he|she|everyone|everything)\\b';
  const parts=s.split(new RegExp('[,;]\\s+(?=(?:and |but |so )?'+sub+')|\\s+(?:and|but)\\s+(?='+sub+')','i')).map(x=>x.trim().replace(/[.!?]+$/,'')).filter(Boolean);
  return parts.length>1&&parts.every(x=>x.split(' ').length>=3)?parts:[s]}
function uniqPoints(a){const seen=new Set();return a.filter(x=>{const k=x.toLowerCase().split(' ').slice(0,6).join(' ');if(!x||seen.has(k))return false;seen.add(k);return true})}
function organiseLocally(text){
  const ss=sentences(text);if(!ss.length)return{title:clip(text,7),summary:text.trim(),highlights:[],lows:[],takeaways:[],tags:['Moment'],ratings:{}};
  const sc=ss.map(s=>({s,low:s.toLowerCase(),v:sentiment(s.toLowerCase())}));
  const tips=sc.filter(x=>TAKE_RE.test(x.low)).slice(0,4);
  const un=sc.filter(x=>!tips.includes(x)).flatMap(x=>clauses(x.s)).map(s=>({s,low:s.toLowerCase(),v:sentiment(s.toLowerCase())}));
  const top=[...un].filter(x=>x.v>0).sort((a,b)=>b.v-a.v).slice(0,5);
  const anyCat=x=>Object.values(CATWORDS).some(ws=>ws.some(w=>hasWord(x.low,w)));
  const extra=top.length<3?un.filter(x=>x.v===0&&anyCat(x)).slice(0,3-top.length):[];
  const highlights=uniqPoints(un.filter(x=>top.includes(x)||extra.includes(x)).map(x=>point(x.s)));
  const lows=uniqPoints(un.filter(x=>x.v<0).slice(0,4).map(x=>point(x.s)));
  const takeaways=uniqPoints(tips.map(x=>tipPoint(x.s)));
  const stop=/\s+(and|the|a|an|of|in|to|with|at|on|for|was|were|is|we|i|it|that|this|my|our|so|but)$/i;
  let title=clip(point((top[0]||sc[0]).s).replace(/…$/,'').replace(/^(today|yesterday|this morning|tonight|last night|then|after that)[, ]+/i,'').split(/[,;]| and | but | because /)[0],7).replace(/…$/,'');while(stop.test(title))title=title.replace(stop,'');
  title=title.charAt(0).toUpperCase()+title.slice(1);
  let summary='';for(const x of sc){if((summary+' '+x.s).split(' ').length>60&&summary)break;summary+=(summary?' ':'')+x.s.replace(/[.!?]*$/,'.')}
  const low=text.toLowerCase();const tags=Object.entries(TAGWORDS).filter(([,ws])=>ws.some(w=>hasWord(low,w))).map(([t])=>t);
  const ratings={};
  const bits=sc.flatMap(x=>x.s.split(/[,;]| but | and /)).map(c=>c.toLowerCase().trim()).filter(Boolean).map(c=>({low:c,v:sentiment(c)}));
  for(const[k,ws]of Object.entries(CATWORDS)){const hit=bits.filter(x=>ws.some(w=>hasWord(x.low,w)));if(!hit.length)continue;
    const num=hit.map(x=>x.low.match(/(\d{1,2})\s*(?:\/|out of)\s*10/)).find(Boolean);
    if(num){ratings[k]=Math.max(1,Math.min(10,+num[1]));continue}
    if(k==='live'){ratings[k]=/wouldn't|couldn't|would not|could not|never/.test(hit.map(x=>x.low).join(' '))?3:8;continue}
    const v=hit.reduce((a,x)=>a+x.v,0);
    if(v>=2)ratings[k]=9;else if(v===1)ratings[k]=8;else if(v===-1)ratings[k]=4;else if(v<=-2)ratings[k]=3}
  return{title,summary,highlights,lows,takeaways,tags:tags.length?tags:['Moment'],ratings}}
/* Which of the "things worth mentioning" has been covered so far. */
function coverage(text){const low=text.toLowerCase(),c=new Set(),any=ws=>ws.some(w=>hasWord(low,w));
  if(STRONG.some(w=>hasWord(low,w))||/best (bit|part|moment|thing)|highlight/.test(low))c.add('best');
  if(any(CATWORDS.food))c.add('food');
  if(any(CATWORDS.people)||any(TAGWORDS.People)||/\bwith (my|our|a|some|the) /.test(low))c.add('people');
  if(any(CATWORDS.sights)||any(CATWORDS.nature)||any(TAGWORDS['Sport & events'])||/\b(saw|visited|went to|walked|watched|explored)\b/.test(low))c.add('saw');
  if(any(CATWORDS.vibe)||/\b(felt|feel|feeling|feels)\b/.test(low))c.add('feel');
  if(any(CATWORDS.live))c.add('live');
  if(TAKE_RE.test(low))c.add('tips');
  return c}
/* "back in 2019", "three years ago", "last March": when the memory is from, if they said. */
function dateFromText(text){const low=text.toLowerCase(),cy=new Date().getFullYear();let y=null;
  const m=low.match(/\b(19[5-9]\d|20\d{2})\b/);
  if(m&&+m[1]<=cy)y=+m[1];else if(/\blast year\b/.test(low))y=cy-1;
  else{const a=low.match(/\b(\d{1,2}|a|one|two|three|four|five|six|seven|eight|nine|ten|a couple of|a few)\s+years?\s+(ago|back)\b/);
    if(a){const n={a:1,one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,'a couple of':2,'a few':3}[a[1]]??+a[1];if(n>0&&n<70)y=cy-n}}
  let mo=null;const MN=['january','february','march','april','may','june','july','august','september','october','november','december'];
  for(let i=0;i<12;i++)if(new RegExp('\\b(in|last|this|early|late|mid|of|during)\\s+'+MN[i]+'\\b').test(low)){mo=i+1;break}
  return y||mo?{y:y||cy,mo}:null}
function summariseLocally(p,ms){const uniq=a=>[...new Set(a.map(x=>x.trim()).filter(Boolean))];const fav=[...ms].sort((a,b)=>(b.favorite?1:0)-(a.favorite?1:0));
  const ys=uniq(ms.map(m=>(m.date||'').slice(0,4))).sort();
  const lead=fav.slice(0,2).map(m=>(m.body||'').split(/(?<=[.!?])\s+/)[0]).filter(Boolean).join(' ');
  return{summary:`${ms.length} ${ms.length===1?'memory':'memories'} from ${p.name}${ys.length?' ('+(ys.length>1?ys[0]+' to '+ys[ys.length-1]:ys[0])+')':''}. ${lead}`.trim(),
    highlights:uniq(fav.flatMap(m=>m.highlights||[])).slice(0,5),takeaways:uniq(fav.flatMap(m=>m.takeaways||[])).slice(0,4)}}
/* A browser's own on-device model, where one is already installed. Never downloads one. */
async function builtinAI(prompt){const LM=self.LanguageModel;if(!LM)return null;try{if(await LM.availability()!=='available')return null;const s=await LM.create();const t=await s.prompt(prompt);s.destroy?.();return parseJSON(t)}catch(e){return null}}
const noKey=e=>B.mode==='local'&&e?.code==='no_key';
async function organise(text,prompt){try{return await B.ai(prompt)}catch(e){if(noKey(e))return(await builtinAI(prompt))||organiseLocally(text);throw e}}
async function summarise(p,ms,prompt){try{return await B.ai(prompt)}catch(e){if(noKey(e))return(await builtinAI(prompt))||summariseLocally(p,ms);throw e}}
async function suggestAI(prompt){try{return await B.ai(prompt)}catch(e){if(noKey(e)){const r=await builtinAI(prompt);if(r)return r}throw e}}

/* ---------- backends: the same app runs as a Claude artifact or as a standalone site ---------- */
let B={url:()=>'',hasAI:()=>false,photo:null};
const parseJSON=t=>{const a=t.indexOf('{'),b=t.lastIndexOf('}');if(a<0||b<a)throw{code:'bad_json'};return JSON.parse(t.slice(a,b+1))};
function geoCountry(name){const f=G.features.find(x=>x.properties.name.toLowerCase()===name.trim().toLowerCase());if(!f)return null;const c=d3.geoCentroid(f);return{found:true,kind:'country',name:f.properties.name,country:f.properties.name,lat:c[1],lng:c[0]}}

async function artifactBackend(C){
  let sample=null;
  const db=await C.use('db');if(!db)throw{code:'unavailable'};
  const P=db.collection(PLACES),M=db.collection(MEMS),T=db.collection('wb/journal/trips');
  const be={mode:'artifact',url:id=>'/_blob/'+id,photo:null,hasAI:()=>!!sample,
    ai:async p=>{if(!sample)throw{code:'unavailable'};return sample.json(p,{modelTier:'default'})},
    geocode:async(name,country)=>geoCountry(name)||be.ai(`Find this place for a travel journal map: "${name}"${country?`, in ${country}`:''}.
Return JSON only: {"found": true or false, "kind": "city" or "country", "name": the usual English name (just the city or country, no region), "country": the country it is in (English common name), "lat": latitude number, "lng": longitude number}. For a country, use its geographic centre.`),
    setPlace:(id,d)=>P.doc(id).set(d),updatePlace:(id,d)=>P.doc(id).update(d),delPlace:id=>P.doc(id).delete(),
    setTrip:(id,d)=>T.doc(id).set(d),delTrip:id=>T.doc(id).delete(),
    addMem:d=>M.add(d),updateMem:(id,d)=>M.doc(id).update(d),delMem:id=>M.doc(id).delete()};
  C.use('assets').then(a=>{if(a)be.photo={upload:async b=>(await a.upload(b)).id,del:id=>a.delete(id)}});
  C.use('sample').then(x=>{sample=x;rerender()});
  C.use('dictation').then(d=>{if(!d)return;S.dict=d;
    d.onFinal(({text})=>S.dictTarget?.append(text));d.onPartial(({text})=>S.dictTarget?.partial(text));d.onState(({state,reason})=>S.dictTarget?.state(state,reason))});
  const onErr=err=>{S.dbState=(err?.code==='not_granted'||err?.code==='invalid_argument')?'private':'error';rerender()};
  const ready=()=>{if(S.loaded.p&&S.loaded.m)S.dbState='ready';rerender()};
  P.onSnapshot(snap=>{S.places=snap.docs.map(d=>({id:d.id,...d.data()}));S.loaded.p=true;if(S.sel?.type==='place'&&!place(S.sel.id))S.sel=null;ready()},onErr);
  M.onSnapshot(snap=>{S.memories=snap.docs.map(d=>({id:d.id,...d.data()}));S.loaded.m=true;ready()},onErr);
  T.onSnapshot(snap=>{S.trips=snap.docs.map(d=>({id:d.id,...d.data()}));rerender()},()=>{});
  return be}

async function localBackend(){
  const idb=await new Promise((res,rej)=>{const r=indexedDB.open('wonderbook',2);r.onupgradeneeded=()=>{['places','memories','photos','trips'].forEach(n=>{if(!r.result.objectStoreNames.contains(n))r.result.createObjectStore(n)})};r.onsuccess=()=>{r.result.onversionchange=()=>r.result.close();res(r.result)};r.onerror=()=>rej(r.error)});
  const tx=(store,mode,fn)=>new Promise((res,rej)=>{const t=idb.transaction(store,mode);const q=fn(t.objectStore(store));t.oncomplete=()=>res(q?.result);t.onerror=t.onabort=()=>rej(t.error)});
  const all=async store=>{const keys=await tx(store,'readonly',s=>s.getAllKeys()),vals=await tx(store,'readonly',s=>s.getAll());return keys.map((k,i)=>[k,vals[i]])};
  const P=new Map(await all('places')),M=new Map(await all('memories')),T=new Map(await all('trips')),urls=new Map();
  for(const[id,b]of await all('photos'))urls.set(id,URL.createObjectURL(b));
  const emit=()=>{S.places=[...P].map(([id,d])=>({id,...d}));S.memories=[...M].map(([id,d])=>({id,...d}));S.trips=[...T].map(([id,d])=>({id,...d}));if(S.sel?.type==='trip'&&!T.has(S.sel.id))S.sel=null;if(S.sel?.type==='place'&&!P.has(S.sel.id))S.sel=null;rerender()};
  const put=async(store,map,id,d)=>{const{id:_,...doc}=d;doc.updatedAt=Date.now();map.set(id,doc);await tx(store,'readwrite',s=>s.put(doc,id));emit();scheduleSync()};
  const del=async(store,map,id)=>{map.delete(id);await tx(store,'readwrite',s=>s.delete(id));ls.set('wb_deleted',{...ls.get('wb_deleted',{}),[id]:Date.now()});emit();scheduleSync()};
  /* ---- sync between devices through a private GitHub repository the owner controls ---- */
  const ls={get:(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del:k=>{try{localStorage.removeItem(k)}catch(e){}}};
  const sync={status:'off',running:false,again:false,timer:null};
  const setStatus=st=>{sync.status=st;const el=$('#sync-pill');if(!el)return;el.hidden=st==='off';el.dataset.st=st;
    el.textContent={syncing:'Syncing…',ok:'Synced',error:'Sync paused',auth:'Sync needs attention'}[st]||'';el.title=st==='ok'?'Tap to sync now':st==='error'?'Could not reach GitHub. Tap to try again.':''};
  const gh=(cfg,path,opt={})=>fetch(`https://api.github.com/repos/${cfg.repo}${path}`,{cache:'no-store',...opt,headers:{Authorization:'Bearer '+cfg.token,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28',...(opt.headers||{})}});
  const b64e=str=>{const b=new TextEncoder().encode(str);let s='';for(let i=0;i<b.length;i+=0x8000)s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(s)};
  const b64d=b=>{const s=atob(b.replace(/\s/g,''));const u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return new TextDecoder().decode(u)};
  const canon=o=>JSON.stringify(o,(k,v)=>v&&typeof v==='object'&&!Array.isArray(v)?Object.fromEntries(Object.keys(v).sort().map(x=>[x,v[x]])):v);
  const putFile=(cfg,path,content,sha)=>gh(cfg,'/contents/'+path,{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify({message:'Wonderbook sync',content,branch:cfg.branch,...(sha?{sha}:{})})});
  async function syncNow(){const cfg=ls.get('wb_sync',null);if(!cfg)return;if(sync.running){sync.again=true;return}
    sync.running=true;setStatus('syncing');
    try{
      for(let attempt=0;;attempt++){
        let remote={places:{},memories:{},trips:{},deleted:{}},sha=null;
        const r=await gh(cfg,'/contents/journal.json?ref='+encodeURIComponent(cfg.branch));
        if(r.status===200){const j=await r.json();sha=j.sha;let c=j.content;if(!c)c=(await(await gh(cfg,'/git/blobs/'+j.sha)).json()).content;const d=JSON.parse(b64d(c));remote={places:d.places||{},memories:d.memories||{},trips:d.trips||{},deleted:d.deleted||{}}}
        else if(r.status===401||r.status===403)throw{code:'auth'};
        else if(r.status!==404)throw{code:'net'};
        const deleted={...remote.deleted};for(const[k,v]of Object.entries(ls.get('wb_deleted',{})))deleted[k]=Math.max(deleted[k]||0,v);
        const merge=async(store,map,rem)=>{const out={};
          for(const id of new Set([...Object.keys(rem),...map.keys()])){const l=map.get(id),m=rem[id];const w=!l?m:!m?l:((m.updatedAt||0)>(l.updatedAt||0)?m:l);
            if(deleted[id]&&deleted[id]>=(w.updatedAt||0)){if(l){map.delete(id);await tx(store,'readwrite',s=>s.delete(id))}continue}
            out[id]=w;if(w!==l){map.set(id,w);await tx(store,'readwrite',s=>s.put(w,id))}}
          return out};
        const next={v:1,places:await merge('places',P,remote.places),memories:await merge('memories',M,remote.memories),trips:await merge('trips',T,remote.trips),deleted};
        ls.set('wb_deleted',deleted);emit();
        if(canon(next)===canon({v:1,...remote}))break;
        const w=await putFile(cfg,'journal.json',b64e(JSON.stringify(next)),sha);
        if(w.ok)break;
        if(w.status===401||w.status===403)throw{code:'auth'};
        if((w.status===409||w.status===422)&&attempt<3)continue;
        throw{code:'net'}}
      /* photos: upload what this device has, download what it is missing */
      const need=new Set();for(const m of M.values())(m.photos||[]).forEach(x=>need.add(x));for(const p of P.values())if(p.coverId)need.add(p.coverId);
      const have=new Set();const tr=await gh(cfg,`/git/trees/${encodeURIComponent(cfg.branch)}?recursive=1`);
      if(tr.ok)for(const t of(await tr.json()).tree||[])if(t.path.startsWith('photos/'))have.add(t.path.slice(7));
      let got=false;
      for(const id of need){
        if(urls.has(id)&&!have.has(id)){const b=await tx('photos','readonly',s=>s.get(id));if(!b)continue;
          const data=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(String(fr.result).split(',')[1]);fr.readAsDataURL(b)});
          const w=await putFile(cfg,'photos/'+id,data);if(!w.ok&&w.status!==422)throw{code:w.status===401||w.status===403?'auth':'net'}}
        else if(!urls.has(id)&&have.has(id)){const r=await gh(cfg,'/contents/photos/'+id+'?ref='+encodeURIComponent(cfg.branch),{headers:{Accept:'application/vnd.github.raw+json'}});
          if(r.ok){const b=new Blob([await r.arrayBuffer()],{type:'image/jpeg'});await tx('photos','readwrite',s=>s.put(b,id));urls.set(id,URL.createObjectURL(b));got=true}}}
      if(got)emit();
      ls.set('wb_synced_at',Date.now());setStatus('ok');
    }catch(e){setStatus(e?.code==='auth'?'auth':'error')}
    finally{sync.running=false;if(sync.again){sync.again=false;syncNow()}}}
  const scheduleSync=()=>{if(!ls.get('wb_sync',null))return;clearTimeout(sync.timer);sync.timer=setTimeout(()=>{sync.timer=null;syncNow()},2500)};
  const be={mode:'local',url:id=>urls.get(id)||'',hasAI:()=>true,
    sync:{cfg:()=>ls.get('wb_sync',null),last:()=>ls.get('wb_synced_at',0),status:()=>sync.status,now:syncNow,
      connect:async(repo,token)=>{const r=await gh({repo,token},'');if(r.status===401)throw{code:'bad_token'};if(!r.ok)throw{code:'no_repo'};const j=await r.json();if(j.permissions&&j.permissions.push===false)throw{code:'read_only'};ls.set('wb_sync',{repo,token,branch:j.default_branch||'main'});await syncNow()},
      disconnect:()=>{ls.del('wb_sync');setStatus('off')}},
    photo:{upload:async b=>{const id=uid();await tx('photos','readwrite',s=>s.put(b,id));urls.set(id,URL.createObjectURL(b));return id},
           del:async id=>{await tx('photos','readwrite',s=>s.delete(id));const u=urls.get(id);if(u)URL.revokeObjectURL(u);urls.delete(id)}},
    ai:claudeJSON,
    suggest:async(q,country)=>{const r=await fetch('https://photon.komoot.io/api/?limit=7&lang=en&layer=city&layer=country&q='+encodeURIComponent(q)).then(r=>r.json());const out=[],seen=new Set();
      for(const f of r.features||[]){const p=f.properties||{},c=f.geometry?.coordinates;if(!p.name||!c)continue;const kind=p.type==='country'?'country':'city';const o={kind,name:p.name,country:kind==='country'?p.name:(p.country||''),region:kind==='country'?'':(p.state||p.county||''),lat:c[1],lng:c[0]};
        const key=o.name+'|'+o.region+'|'+o.country;if(seen.has(key))continue;seen.add(key);out.push(o)}
      if(country){const cl=country.toLowerCase();out.sort((a,b)=>(b.country.toLowerCase().includes(cl)?1:0)-(a.country.toLowerCase().includes(cl)?1:0))}
      return out},
    geocode:async(name,country)=>{const c=geoCountry(name);if(c)return c;
      const r=await fetch('https://geocoding-api.open-meteo.com/v1/search?count=8&language=en&format=json&name='+encodeURIComponent(name)).then(r=>r.json());
      const rs=r.results||[];if(!rs.length)return{found:false};
      const hit=(country&&rs.find(x=>(x.country||'').toLowerCase().includes(country.toLowerCase())))||rs[0];
      return{found:true,kind:String(hit.feature_code||'').startsWith('PCL')?'country':'city',name:hit.name,country:hit.country||country,lat:hit.latitude,lng:hit.longitude}},
    setPlace:(id,d)=>put('places',P,id,d),updatePlace:(id,d)=>put('places',P,id,{...P.get(id),...d}),delPlace:id=>del('places',P,id),
    setTrip:(id,d)=>put('trips',T,id,d),delTrip:id=>del('trips',T,id),
    addMem:d=>put('memories',M,uid(),d),updateMem:(id,d)=>put('memories',M,id,{...M.get(id),...d}),delMem:id=>del('memories',M,id),
    exportBackup:async()=>{const photos={};for(const[id,b]of await all('photos'))photos[id]=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(b)});
      const data={app:'wonderbook',v:1,exportedAt:new Date().toISOString(),places:S.places,memories:S.memories,trips:S.trips,photos};
      const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'}));a.download=`wonderbook-backup-${today()}.json`;document.body.appendChild(a);a.click();a.remove()},
    importBackup:async file=>{const data=JSON.parse(await file.text());if(data.app!=='wonderbook')throw new Error('not a backup');
      for(const[id,u]of Object.entries(data.photos||{})){const b=await fetch(u).then(r=>r.blob());await tx('photos','readwrite',s=>s.put(b,id));if(!urls.has(id))urls.set(id,URL.createObjectURL(b))}
      for(const p of data.places||[]){const{id,...d}=p;P.set(id,d);await tx('places','readwrite',s=>s.put(d,id))}
      for(const m of data.memories||[]){const{id,...d}=m;M.set(id,d);await tx('memories','readwrite',s=>s.put(d,id))}
      for(const t of data.trips||[]){const{id,...d}=t;T.set(id,d);await tx('trips','readwrite',s=>s.put(d,id))}
      emit();scheduleSync();return{places:(data.places||[]).length,memories:(data.memories||[]).length}}};
  navigator.storage?.persist?.().catch(()=>{});
  S.dict=localDictation();$('#btn-settings').hidden=false;
  S.dbState='ready';emit();
  if(ls.get('wb_sync',null))syncNow();
  document.addEventListener('visibilitychange',()=>{if(!ls.get('wb_sync',null))return;if(!document.hidden)syncNow();else if(sync.timer){clearTimeout(sync.timer);sync.timer=null;syncNow()}});
  if('serviceWorker'in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('sw.js').catch(()=>{});
  return be}

/* Claude API, called straight from this browser with the key the owner saved on this device. */
async function claudeJSON(prompt){
  let key='';try{key=localStorage.getItem('wb_key')||''}catch(e){}
  if(!key)throw{code:'no_key'};
  const body={model:'claude-opus-5-5',max_tokens:16000,fallbacks:'default',messages:[{role:'user',content:prompt}]};
  const call=(b,beta)=>fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2026-10-21','anthropic-dangerous-direct-browser-access':'true',...(beta?{'anthropic-beta':'server-side-fallback-2026-07-01'}:{})},body:JSON.stringify(b)});
  let r=await call(body,true);
  if(r.status===400){const{fallbacks,...rest}=body;r=await call(rest,false)}
  if(r.status===401||r.status===403)throw{code:'bad_key'};
  if(r.status===429)throw{code:'rate_limited'};
  if(!r.ok)throw{code:'upstream_error'};
  const m=await r.json();
  if(m.stop_reason==='refusal')throw{code:'refused'};
  return parseJSON((m.content||[]).filter(b=>b.type==='text').map(b=>b.text).join(''))}

/* Browser speech recognition, shaped like the artifact dictation capability. */
function localDictation(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return null;let rec=null,on=false;
  return{active:()=>on,
    start:()=>new Promise((res,rej)=>{on=true;rec=new SR();rec.continuous=true;rec.interimResults=true;rec.lang=navigator.language||'en-GB';S.dictTarget?.state('starting');
      rec.onstart=()=>{S.dictTarget?.state('listening');res()};
      rec.onresult=e=>{let interim='';for(let i=e.resultIndex;i<e.results.length;i++){const x=e.results[i];if(x.isFinal){const t=x[0].transcript.trim();if(t)S.dictTarget?.append(' '+t.charAt(0).toUpperCase()+t.slice(1)+(/[.!?]$/.test(t)?'':'.'))}else interim+=x[0].transcript}S.dictTarget?.partial(interim)};
      rec.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed'){on=false;rej({code:'not_granted'})}};
      rec.onend=()=>{if(on){try{rec.start();return}catch(_){on=false}}S.dictTarget?.state('idle','stopped')};
      try{rec.start()}catch(e){on=false;rej({code:'upstream_error'})}}),
    stop:()=>{on=false;try{rec?.stop()}catch(_){}return Promise.resolve()}}}

function openSettings(){if(B.mode!=='local')return;if($('#set-key'))return;
  let key='';try{key=localStorage.getItem('wb_key')||''}catch(e){}
  openModal(`<h2>Settings</h2>
  <div class="panel-card"><h3>AI features</h3><p class="muted" style="margin:0">Optional. Wonderbook organises your notes on this device with no key. Adding your own Claude API key (from console.anthropic.com) gives better write-ups and switches on “Ask Claude for more ideas”. It is saved only in this browser and sent only to Anthropic.</p>
  <label class="field">Claude API key<input type="password" id="set-key" value="${esc(key)}" placeholder="sk-ant-…" autocomplete="off"></label>
  <div style="display:flex;gap:8px"><button class="btn primary" id="set-save">Save key</button>${key?'<button class="btn" id="set-clear">Remove key</button>':''}</div></div>
  <div class="panel-card" id="set-sync"></div>
  <div class="panel-card"><h3>Your data</h3><p class="muted" style="margin:0" id="set-usage">Your journal and photos are stored in this browser on this device. Turn on sync above to share them between your devices. A downloaded backup is a second safe copy.</p>
  <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="set-export">Download backup</button><label class="btn" style="cursor:pointer">Restore from backup<input type="file" id="set-import" accept="application/json,.json" hidden></label></div></div>
  <div class="foot"><button class="btn" data-close>Done</button></div>`,(el,close)=>{const q=s=>el.querySelector(s);
    q('[data-close]').onclick=close;
    q('#set-save').onclick=()=>{try{localStorage.setItem('wb_key',q('#set-key').value.trim());toast('Key saved on this device');close()}catch(e){toast('This browser blocked saving the key.')}};
    if(q('#set-clear'))q('#set-clear').onclick=()=>{try{localStorage.removeItem('wb_key')}catch(e){}toast('Key removed');close()};
    q('#set-export').onclick=()=>B.exportBackup().then(()=>toast('Backup downloaded')).catch(()=>toast('Could not create the backup.'));
    q('#set-import').onchange=async()=>{const f=q('#set-import').files[0];if(!f)return;try{const r=await B.importBackup(f);toast(`Restored ${r.places} places and ${r.memories} memories`);close()}catch(e){toast('That file is not a Wonderbook backup.')}};
    const drawSync=()=>{const c=B.sync.cfg(),box=q('#set-sync'),last=B.sync.last(),guess=location.hostname.endsWith('.github.io')?location.hostname.split('.')[0]+'/wonderbook-data':'';
      if(c){box.innerHTML=`<h3>Sync between devices</h3><p class="muted" style="margin:0">Connected to <b>${esc(c.repo)}</b>, a private GitHub repository. ${B.sync.status()==='auth'?'GitHub rejected the saved token. Disconnect and connect again with a new one.':last?'Last synced '+new Date(last).toLocaleString()+'.':'Not synced yet.'}</p><div style="display:flex;gap:8px"><button class="btn primary" id="sy-now">Sync now</button><button class="btn" id="sy-off">Disconnect this device</button></div>`;
        q('#sy-now').onclick=async()=>{q('#sy-now').disabled=true;await B.sync.now();drawSync();toast(B.sync.status()==='ok'?'Synced':'Sync did not finish. Try again.')};
        q('#sy-off').onclick=()=>{B.sync.disconnect();drawSync()}}
      else{box.innerHTML=`<h3>Sync between devices</h3><p class="muted" style="margin:0">Keeps your journal and photos the same on your phone and laptop, stored in a private GitHub repository only you can open. Paste the same access token on each device.</p>
        <label class="field">Private repository<input type="text" id="sy-repo" value="${esc(guess)}" placeholder="username/wonderbook-data" autocomplete="off" autocapitalize="off"></label>
        <label class="field">GitHub access token<input type="password" id="sy-token" placeholder="github_pat_…" autocomplete="off"></label>
        <p class="muted" id="sy-msg" style="margin:0;min-height:1.4em"></p><button class="btn primary" id="sy-on" style="align-self:flex-start">Connect</button>`;
        q('#sy-on').onclick=async()=>{const repo=q('#sy-repo').value.trim().replace(/^https:\/\/github\.com\//,'').replace(/\/$/,''),token=q('#sy-token').value.trim();
          if(!/^[\w.-]+\/[\w.-]+$/.test(repo)||!token){q('#sy-msg').textContent='Enter the repository as username/name, and paste the token.';return}
          q('#sy-on').disabled=true;q('#sy-msg').innerHTML='<span class="spinner"></span> Connecting…';
          try{await B.sync.connect(repo,token);drawSync();toast('Sync is on')}
          catch(e){q('#sy-on').disabled=false;q('#sy-msg').textContent=e?.code==='bad_token'?'GitHub rejected that token. Check you copied all of it.':e?.code==='read_only'?'That token can read the repository but not save to it. It needs Contents: Read and write.':e?.code==='no_repo'?'Could not open that repository with this token. Check the name and that the token includes it.':'Could not reach GitHub. Check your connection.'}}}};
    drawSync();
    navigator.storage?.estimate?.().then(e=>{if(e?.usage!=null)q('#set-usage').textContent+=` Using ${(e.usage/1048576).toFixed(1)} MB so far.`}).catch(()=>{})})}

/* ---------- boot ---------- */
(async function boot(){
  route();await initGlobe();rerender();
  const timer=setTimeout(()=>{if(S.dbState==='loading'){S.dbState='error';rerender()}},10000);
  try{B=window.claude?.use?await artifactBackend(window.claude):await localBackend()}
  catch(e){S.dbState='error'}
  S.panelKey='';rerender();enter($('#v-'+S.view));
  const reopen=n=>{const d=draftStore.get();if(!d||$('.overlay'))return;if(S.dbState!=='ready'){if(n>0)setTimeout(()=>reopen(n-1),700);return}
    const mem=d.id?S.memories.find(x=>x.id===d.id):undefined;if(d.id&&!mem){draftStore.clear();return}if(S.places.length)openComposer({mem})};
  setTimeout(()=>reopen(8),500);
})();
