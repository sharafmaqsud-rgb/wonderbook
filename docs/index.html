<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F7EFDD">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Wonderbook">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>Wonderbook</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Special+Elite&display=swap">
<style>
/* Scrapbook: a cream paper desk, polaroids held down with washi tape, sticker buttons, handwritten headings.
   The globe stays the hero; the side panel is a notebook page (a bottom sheet on phones). */
:root{
  --bg:#F7EFDD; --surface:#FFFCF4; --surface-2:#F2E8D2; --ink:#2A2238; --ink-2:#6B6078; --line:#DDCFB2;
  --ocean:#CFECF6; --ocean-2:#92D2E8; --land:#FFF8E8; --land-line:#C8B78C;
  --visit:#FF6A3D; --visit-2:#EE2F6E; --wish:#6B55F2; --sun:#FFC62E; --mint:#14B8A2; --sky:#3BA6EF;
  --on:#2A2238; --on-wish:#FFFFFF; --photo:#FFFFFF; --photo-ink:#2A2238; --photo-ink-2:#6B6078;
  --note-y:#FFE88A; --note-p:#FFC4D6; --note-b:#BFE6FA; --note-g:#C5F0D8; --note-ink:#2A2238;
  --glow:rgba(120,90,40,.24); --shadow:0 10px 24px rgba(70,50,20,.16);
  --font-display:'Caveat','Bradley Hand','Segoe Print',cursive;
  --font-body:'DM Sans',ui-sans-serif,system-ui,-apple-system,sans-serif;
  --font-mono:'Special Elite','Courier New',ui-monospace,monospace;
  --r:6px; --wob:255px 18px 225px 18px/18px 225px 18px 255px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1C1824; --surface:#27212F; --surface-2:#332B3E; --ink:#F7EFDD; --ink-2:#B9ADC4; --line:#463C55;
  --ocean:#16304D; --ocean-2:#1F5278; --land:#3A3246; --land-line:#63577A;
  --visit:#FF7B52; --visit-2:#FF4F8A; --wish:#9685FF; --sun:#FFCF4D; --mint:#2AD3BD; --sky:#5DB9F5;
  --on:#231C2E; --on-wish:#231C2E; --photo:#F4ECDD;
  --note-y:#F3D96B; --note-p:#F2A9C0; --note-b:#A6D6EE; --note-g:#A9DFC2;
  --glow:rgba(0,0,0,.5); --shadow:0 10px 24px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1C1824; --surface:#27212F; --surface-2:#332B3E; --ink:#F7EFDD; --ink-2:#B9ADC4; --line:#463C55;
  --ocean:#16304D; --ocean-2:#1F5278; --land:#3A3246; --land-line:#63577A;
  --visit:#FF7B52; --visit-2:#FF4F8A; --wish:#9685FF; --sun:#FFCF4D; --mint:#2AD3BD; --sky:#5DB9F5;
  --on:#231C2E; --on-wish:#231C2E; --photo:#F4ECDD;
  --note-y:#F3D96B; --note-p:#F2A9C0; --note-b:#A6D6EE; --note-g:#A9DFC2;
  --glow:rgba(0,0,0,.5); --shadow:0 10px 24px rgba(0,0,0,.45); color-scheme:dark}

html,body{height:100%}
body{background:var(--bg) radial-gradient(circle at 1px 1px,color-mix(in srgb,var(--ink) 10%,transparent) 1px,transparent 1.5px) 0 0/22px 22px;color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;overflow:hidden}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--wish);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;font-weight:700;line-height:1}
.mono{font-family:var(--font-mono)}
.muted{color:var(--ink-2)}
.app{height:100%;display:flex;flex-direction:column}
.hl{background:linear-gradient(transparent 58%,color-mix(in srgb,var(--sun) 70%,transparent) 58% 92%,transparent 92%);padding:0 .12em}

/* Header */
header.top{display:flex;align-items:center;gap:16px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:2px dashed var(--line);background:var(--surface);flex-wrap:wrap;position:relative;z-index:5}
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{width:36px;height:36px;border-radius:50%;background:conic-gradient(from 200deg,var(--visit-2),var(--visit),var(--sun),var(--mint),var(--wish),var(--visit-2));position:relative;flex:none;border:2px solid var(--ink);animation:bob 5s ease-in-out infinite}
.brand-mark::after{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--surface);border:2px solid var(--ink)}
.brand h1{font-size:38px;rotate:-2deg}
nav.tabs{display:flex;gap:6px;padding:2px}
nav.tabs a{padding:5px 13px;text-decoration:none;color:var(--ink-2);font-weight:700;font-size:14px;border-radius:var(--wob);border:2px solid transparent;transition:rotate .2s,background .2s,translate .2s}
nav.tabs a:hover{rotate:-2deg;color:var(--ink)}
nav.tabs a[aria-current="page"]{background:var(--sun);color:var(--on);border-color:var(--ink);box-shadow:2px 2px 0 var(--ink);rotate:-2deg}
.stats{display:flex;gap:18px;margin-left:auto;align-items:baseline}
.stat b{font-family:var(--font-display);font-size:30px;font-weight:700;display:block;line-height:.9}
.stat span{font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.actions{display:flex;gap:10px}
.btn{border:2px solid var(--ink);background:var(--surface);border-radius:var(--wob);padding:7px 15px;font-weight:700;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;box-shadow:3px 3px 0 var(--ink);transition:translate .12s,box-shadow .12s,rotate .2s;text-decoration:none;color:var(--ink)}
.btn:hover{translate:-1px -1px;box-shadow:4px 4px 0 var(--ink);rotate:-1deg}
.btn:active{translate:2px 2px;box-shadow:1px 1px 0 var(--ink)}
.btn.primary{background:var(--visit);color:var(--on)}
.btn.violet{background:var(--wish);color:var(--on-wish)}
.btn.ghost{border-color:transparent;background:transparent;box-shadow:none;text-decoration:underline;text-decoration-style:wavy;text-decoration-color:var(--line);text-underline-offset:4px}
.btn.ghost:hover{box-shadow:none;text-decoration-color:var(--visit)}
.btn.sm{padding:4px 11px;font-size:13px;box-shadow:2px 2px 0 var(--ink)}
.btn.sm.ghost{box-shadow:none}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:16px;height:16px}

/* Main */
main{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0}
.view.enter{animation:viewin .4s ease both}
.globe-view{display:grid;grid-template-columns:minmax(0,1fr) 440px}
.globe-wrap{position:relative;min-width:0;min-height:0;overflow:hidden;touch-action:none}
.globe-wrap svg{width:100%;height:100%;display:block;cursor:grab}
.globe-wrap svg:active{cursor:grabbing}
.sphere{filter:drop-shadow(0 22px 40px var(--glow));stroke:var(--ink);stroke-width:2.5}
.country{stroke:var(--land-line);stroke-width:.6;transition:fill .5s}
.country:hover{filter:brightness(1.06);stroke:var(--ink)}
.country.sel{stroke:var(--ink);stroke-width:1.6}
.grat{fill:none;stroke:var(--ocean-2);stroke-width:.6;stroke-dasharray:3 4;opacity:.8}
.city{cursor:pointer}
.city .dot{stroke:var(--ink);stroke-width:1.5}
.city.wish .dot{fill:var(--surface);stroke:var(--wish);stroke-width:2.5}
.city.visited .dot{fill:var(--visit-2)}
.city .ring{fill:none;stroke:var(--visit-2);stroke-width:2;opacity:0}
.city.wish .ring{stroke:var(--wish)}
.city.sel .ring{animation:pulse 1.8s ease-out infinite}
.city text{font-family:var(--font-display);font-weight:700;font-size:17px;fill:var(--ink);paint-order:stroke;stroke:var(--surface);stroke-width:4px;pointer-events:none}
.globe-ui{position:absolute;display:flex;gap:8px;align-items:center}
.globe-ui.tl{top:14px;left:max(14px,env(safe-area-inset-left,0px));flex-wrap:wrap;right:70px}
.globe-ui.br{bottom:14px;right:14px;flex-direction:column}
.chip{border:0;background:color-mix(in srgb,var(--sky) 30%,var(--surface));border-radius:2px;padding:5px 13px;font-size:13px;font-weight:700;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12);transition:rotate .2s,translate .2s;clip-path:polygon(0 0,5px 50%,0 100%,100% 100%,calc(100% - 5px) 50%,100% 0)}
.chip:nth-child(3n+2){background:color-mix(in srgb,var(--sun) 45%,var(--surface));rotate:1deg}
.chip:nth-child(3n){background:color-mix(in srgb,var(--mint) 30%,var(--surface));rotate:-1deg}
.chip:hover{translate:0 -2px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);rotate:-2deg}
.zoom-btn{width:40px;height:40px;border-radius:50%;border:2px solid var(--ink);background:var(--surface);font-size:20px;line-height:1;box-shadow:2px 2px 0 var(--ink)}
.zoom-btn:active{translate:2px 2px;box-shadow:none}
.legend{position:absolute;left:max(14px,env(safe-area-inset-left,0px));bottom:16px;background:var(--note-y);color:var(--note-ink);padding:12px 14px;font-size:12px;display:flex;flex-direction:column;gap:6px;max-width:260px;rotate:-2deg;box-shadow:var(--shadow);font-family:var(--font-mono)}
.legend .row{display:flex;align-items:center;gap:8px}
.sw{width:14px;height:14px;border-radius:3px;flex:none;border:1.5px solid var(--note-ink)}
.ramp{height:10px;border-radius:6px;width:150px;border:1.5px solid var(--note-ink)}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--surface);font-size:12px;font-weight:700;padding:4px 9px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-140%);opacity:0;transition:opacity .15s}
.pick-banner{position:absolute;top:60px;left:50%;transform:translateX(-50%);background:var(--wish);color:var(--on-wish);padding:8px 16px;border-radius:var(--wob);border:2px solid var(--ink);font-weight:700;box-shadow:3px 3px 0 var(--ink);display:flex;gap:10px;align-items:center;max-width:calc(100% - 32px)}

/* Panel: a page of the notebook */
.panel{background:var(--surface) linear-gradient(color-mix(in srgb,var(--sky) 13%,transparent) 1px,transparent 1px) 0 0/100% 28px local;border-left:2px solid var(--ink);overflow-y:auto;min-width:0;padding:24px 24px 120px 30px;box-shadow:-8px 0 20px rgba(70,50,20,.08)}
.panel h2{font-size:50px}
.eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.stack{display:flex;flex-direction:column;gap:16px}
.section{display:flex;flex-direction:column;gap:12px;padding-top:18px;border-top:2px dashed var(--line);margin-top:4px}
.section-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.section-h h3,.panel-card h3{font-size:30px}
.section-h h3{background:linear-gradient(transparent 58%,color-mix(in srgb,var(--sun) 70%,transparent) 58% 92%,transparent 92%);padding:0 .15em}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);border:0}
.pill.visited,.pill.wish{font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.06em;border:2px solid currentColor;border-radius:5px;background:none;rotate:-3deg;padding:3px 9px 1px}
.pill.visited{color:var(--visit-2)}
.pill.wish{color:var(--wish)}
.enter .pill.visited,.enter .pill.wish,.stamped{animation:stamp .45s cubic-bezier(.3,1.6,.5,1) backwards .25s}
button.pill{cursor:pointer}button.pill:hover{background:color-mix(in srgb,var(--visit) 20%,var(--surface-2));color:var(--ink)}
.back{background:none;border:0;color:var(--ink-2);padding:0;font-weight:700;display:inline-flex;gap:4px;align-items:center;align-self:flex-start}
.back:hover{color:var(--ink)}
.polaroid{background:var(--photo);color:var(--photo-ink);padding:10px 10px 12px;box-shadow:0 1px 0 rgba(0,0,0,.06),var(--shadow);position:relative;margin:8px 0 0;border-radius:2px}
.taped::before{content:"";position:absolute;top:-12px;left:50%;width:92px;height:26px;margin-left:-46px;background:var(--tape,var(--sun));opacity:.82;rotate:-3deg;box-shadow:0 1px 2px rgba(0,0,0,.14);z-index:2;clip-path:polygon(0 0,4px 25%,0 50%,4px 75%,0 100%,100% 100%,calc(100% - 4px) 75%,100% 50%,calc(100% - 4px) 25%,100% 0);pointer-events:none}
.enter .taped::before{animation:tape .4s ease-out backwards .3s}
.cover-fig{rotate:-1.2deg}
.cover{width:100%;aspect-ratio:16/10;object-fit:cover;display:block}
.scorecard{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.score-tile{border-radius:var(--wob);padding:14px 16px;background:var(--surface);border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);rotate:1deg}
.score-tile b{font-family:var(--font-display);font-size:52px;font-weight:700;line-height:.9;display:block}
.score-tile span{font-size:12px;color:var(--ink-2);font-weight:700}
.score-tile.hot{background:var(--visit);color:var(--on);rotate:-2deg}
.score-tile.hot span{color:var(--on)}
.rate-row{display:grid;grid-template-columns:120px minmax(0,1fr) 28px;align-items:center;gap:10px;font-size:14px}
.rate-row .lbl{font-weight:700}
.segs{display:grid;grid-template-columns:repeat(10,1fr);gap:3px}
.segs button{height:20px;border:1.5px solid color-mix(in srgb,var(--ink) 35%,transparent);border-radius:5px 3px 6px 3px;background:var(--surface);padding:0;transition:translate .1s}
.segs button.on{background:var(--c);border-color:var(--ink)}
.segs button:hover{translate:0 -2px;border-color:var(--ink)}
.rate-row .val{text-align:right;font-weight:700}
.list{display:flex;flex-direction:column;gap:9px}
.mem-row{display:grid;grid-template-columns:56px minmax(0,1fr);gap:12px;align-items:center;padding:7px;border-radius:3px;border:0;background:var(--photo);color:var(--photo-ink);text-align:left;width:100%;box-shadow:0 2px 8px rgba(70,50,20,.14);transition:rotate .2s,translate .2s}
.mem-row:nth-child(odd){rotate:-.5deg}.mem-row:nth-child(even){rotate:.5deg}
.mem-row:hover{rotate:0deg;translate:0 -2px}
.thumb{width:56px;height:56px;border-radius:2px;object-fit:cover;background:var(--surface-2);display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:30px}
.mem-row .t{font-family:var(--font-display);font-weight:700;font-size:23px;line-height:1.05;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mem-row .s{font-family:var(--font-mono);font-size:11px;color:var(--photo-ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
ul.bul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.ai-box,.note{padding:14px 14px 16px;background:var(--note-y);color:var(--note-ink);display:flex;flex-direction:column;gap:8px;box-shadow:0 6px 14px rgba(70,50,20,.16);position:relative;rotate:-.6deg;border-radius:1px 1px 18px 1px/1px 1px 26px 1px}
.note.p{background:var(--note-p);rotate:.7deg}.note.b{background:var(--note-b);rotate:-.4deg}.note.g{background:var(--note-g)}
.ai-box .eyebrow,.note .eyebrow,.ai-box .muted,.note .muted{color:color-mix(in srgb,var(--note-ink) 70%,transparent)}
.note b.h,.ai-box b.h{font-family:var(--font-display);font-size:26px;line-height:1}
.todo{display:grid;grid-template-columns:22px minmax(0,1fr) auto auto;gap:8px;align-items:center;font-size:14px}
.todo input{width:18px;height:18px;accent-color:var(--mint)}
.todo.done .txt{text-decoration:line-through;text-decoration-color:var(--visit);text-decoration-thickness:2px;color:var(--ink-2)}
.type{font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:.05em;padding:3px 7px 1px;border-radius:3px;background:var(--surface-2);color:var(--ink-2)}
.type.sport{background:color-mix(in srgb,var(--mint) 24%,transparent);color:color-mix(in srgb,var(--mint) 55%,var(--ink))}
.type.landmark{background:color-mix(in srgb,var(--sun) 32%,transparent);color:color-mix(in srgb,var(--sun) 40%,var(--ink))}
.type.event{background:color-mix(in srgb,var(--visit-2) 18%,transparent);color:color-mix(in srgb,var(--visit-2) 70%,var(--ink))}
.type.food{background:color-mix(in srgb,var(--visit) 22%,transparent);color:color-mix(in srgb,var(--visit) 60%,var(--ink))}
.type.nature{background:color-mix(in srgb,var(--mint) 18%,transparent);color:color-mix(in srgb,var(--mint) 50%,var(--ink))}
.type.experience{background:color-mix(in srgb,var(--wish) 16%,transparent);color:color-mix(in srgb,var(--wish) 70%,var(--ink))}
.x{border:0;background:none;color:var(--ink-2);font-size:18px;line-height:1;padding:2px 6px}
.add-row{display:flex;gap:6px}
.add-row input{flex:1;min-width:0}
.field{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:700;color:var(--ink-2);min-width:0}
input[type=text],input[type=search],input[type=date],input[type=number],input[type=password],select,textarea{border:2px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-size:15px;width:100%;color:var(--ink);font-weight:400}
input:focus,select:focus,textarea:focus{border-color:var(--ink);outline:none}
textarea{resize:vertical;min-height:80px;line-height:1.5}
.place-row{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--wob);border:2px solid var(--line);background:var(--surface);width:100%;text-align:left;transition:translate .15s,border-color .15s}
.place-row:hover{border-color:var(--ink);translate:3px 0}
.place-row .nm{font-weight:700;flex:1;min-width:0}
.dotc{width:11px;height:11px;border-radius:50%;flex:none;border:1.5px solid var(--ink)}
.empty{border:2px dashed var(--line);border-radius:var(--wob);padding:24px;text-align:center;color:var(--ink-2);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty b{font-family:var(--font-display);font-size:28px;color:var(--ink);line-height:1}
.banner{background:var(--note-y);color:var(--note-ink);padding:10px 14px;font-size:13px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;rotate:-.5deg;box-shadow:0 4px 10px rgba(70,50,20,.14)}

/* Passport stamps */
.stamps{display:flex;flex-wrap:wrap;gap:12px 10px;padding:4px 2px}
.stamp{font-family:var(--font-mono);text-transform:uppercase;font-size:11px;letter-spacing:.05em;border:2px solid var(--c,var(--visit-2));color:var(--c,var(--visit-2));background:none;border-radius:8px;padding:6px 10px 3px;text-align:center;line-height:1.25;rotate:var(--rot,0deg);outline:1.5px dashed var(--c,var(--visit-2));outline-offset:2px;transition:rotate .2s,scale .2s;max-width:150px}
.stamp b{display:block;font-size:13px}
.stamp:hover{rotate:0deg;scale:1.08}
.stamp:nth-child(4n+1){--rot:-5deg;--c:var(--visit-2)}.stamp:nth-child(4n+2){--rot:3deg;--c:var(--wish);border-radius:50px}.stamp:nth-child(4n+3){--rot:-2deg;--c:color-mix(in srgb,var(--mint) 70%,var(--ink))}.stamp:nth-child(4n){--rot:6deg;--c:color-mix(in srgb,var(--visit) 80%,var(--ink));border-radius:50px}

/* Quick picks */
.quick{display:flex;flex-direction:column;gap:8px;padding:12px;border:2px dashed var(--line);border-radius:14px;background:color-mix(in srgb,var(--surface-2) 55%,transparent)}
.quick-chips{display:flex;flex-wrap:wrap;gap:7px}
.qp{border:2px solid var(--ink);background:var(--surface);border-radius:999px;padding:4px 11px 4px 8px;font-size:13px;font-weight:700;display:inline-flex;gap:6px;align-items:center;text-align:left;transition:translate .12s,background .15s,scale .2s,opacity .2s;max-width:100%}
.qp i{font-style:normal;width:18px;height:18px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-size:13px;line-height:1;flex:none}
.qp:hover{translate:0 -2px;background:var(--note-g)}.qp:hover i{background:var(--mint);color:#fff}
.qp.gone{scale:.6;opacity:0}
.qp.landmark i{background:color-mix(in srgb,var(--sun) 60%,var(--surface))}.qp.sport i{background:color-mix(in srgb,var(--mint) 45%,var(--surface))}.qp.food i{background:color-mix(in srgb,var(--visit) 45%,var(--surface))}.qp.nature i{background:color-mix(in srgb,var(--mint) 30%,var(--surface))}.qp.event i{background:color-mix(in srgb,var(--visit-2) 35%,var(--surface))}.qp.experience i{background:color-mix(in srgb,var(--wish) 30%,var(--surface))}

/* Full-page views */
.page{overflow-y:auto;padding-block:28px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.page-inner{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
.page-h{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.page-h h2{font-size:72px;rotate:-1.5deg;transform-origin:left bottom}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.year-h{font-family:var(--font-display);font-size:48px;font-weight:700;color:var(--ink);margin-top:10px;line-height:1;align-self:flex-start;background:linear-gradient(transparent 58%,color-mix(in srgb,var(--mint) 45%,transparent) 58% 92%,transparent 92%);padding:0 .15em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:30px 26px;padding-top:6px}
.card{border:0;background:var(--photo);color:var(--photo-ink);border-radius:2px;text-align:left;padding:10px 10px 6px;display:flex;flex-direction:column;position:relative;box-shadow:0 1px 0 rgba(0,0,0,.06),var(--shadow);rotate:var(--rot,0deg);transition:rotate .25s,translate .25s,scale .25s,box-shadow .25s}
.card:hover{rotate:0deg;translate:0 -5px;scale:1.03;z-index:3;box-shadow:0 18px 34px rgba(70,50,20,.26)}
.grid>:nth-child(4n+1),.tl-grid>:nth-child(4n+1){--rot:-1.6deg;--tape:var(--sun)}
.grid>:nth-child(4n+2),.tl-grid>:nth-child(4n+2){--rot:1.1deg;--tape:var(--mint)}
.grid>:nth-child(4n+3),.tl-grid>:nth-child(4n+3){--rot:-.7deg;--tape:var(--visit-2)}
.grid>:nth-child(4n),.tl-grid>:nth-child(4n){--rot:1.8deg;--tape:var(--sky)}
.card .ph{aspect-ratio:1/1;width:100%;object-fit:cover;background:var(--surface-2);display:block}
.card .ph.none{display:grid;place-items:center;font-family:var(--font-display);font-size:84px;font-weight:700;color:#fff}
.card .body{padding:10px 4px 6px;display:flex;flex-direction:column;gap:4px}
.card .t{font-family:var(--font-display);font-weight:700;font-size:27px;line-height:1}
.card .meta{font-size:13px;color:var(--photo-ink-2)}
.card .meta.k{font-family:var(--font-mono);font-size:11px}
.otd{padding:16px 18px;background:var(--sun);color:var(--on);display:flex;gap:16px;align-items:center;text-align:left;border:2px solid var(--ink);border-radius:var(--wob);box-shadow:4px 4px 0 var(--ink);rotate:-.6deg}
.otd h3{font-size:34px}
.otd img{width:84px;height:84px;object-fit:cover;border:5px solid #fff;rotate:-4deg;box-shadow:var(--shadow)}
.search{max-width:320px;border-radius:var(--wob)!important}
.rank-list{display:flex;flex-direction:column;gap:10px}
.rank{display:grid;grid-template-columns:44px minmax(0,1.2fr) minmax(0,2fr) 48px;gap:12px;align-items:center;padding:10px 14px;border-radius:var(--wob);background:var(--surface);border:2px solid var(--line);text-align:left;width:100%;transition:translate .15s,border-color .15s}
.rank:hover{border-color:var(--ink);translate:4px 0}
.rank .n{font-family:var(--font-display);font-weight:700;font-size:38px;color:var(--ink-2);line-height:.9}
.rank:nth-child(1){border-color:var(--ink);box-shadow:3px 3px 0 var(--ink);background:color-mix(in srgb,var(--sun) 22%,var(--surface))}
.rank:nth-child(1) .n{color:var(--ink)}
.bar{height:14px;border-radius:8px;background:var(--surface-2);overflow:hidden;border:1.5px solid color-mix(in srgb,var(--ink) 30%,transparent)}
.bar i{display:block;height:100%;border-radius:6px}
.enter .bar i{animation:grow .7s cubic-bezier(.2,.8,.3,1) backwards .15s;transform-origin:left}
.rank .v{font-family:var(--font-display);font-weight:700;font-size:34px;text-align:right;line-height:.9}
.h2h{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.h2h-row{display:grid;grid-template-columns:minmax(0,1fr) 120px minmax(0,1fr);gap:10px;align-items:center;font-size:14px}
.h2h-row .l .bar{direction:rtl}
.h2h-row .c{text-align:center;font-weight:700;color:var(--ink-2)}
.panel-card{border:2px solid var(--ink);background:var(--surface);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px;box-shadow:4px 4px 0 var(--ink)}
.wish-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:26px}
.wish-card{border:0;background:var(--surface);padding:22px 18px 18px;display:flex;flex-direction:column;gap:12px;min-width:0;box-shadow:var(--shadow);position:relative;border-radius:2px;border-top:10px solid var(--wish)}
.wish-card:nth-child(3n+2){border-top-color:var(--mint)}.wish-card:nth-child(3n){border-top-color:var(--visit-2)}
.wish-card h3{font-size:40px}
.sugg{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 10px;border-radius:12px;background:var(--surface-2);font-size:14px}

/* Timeline */
.tl-wrap{display:grid;grid-template-columns:270px minmax(0,1fr);gap:36px;max-width:1120px;margin:0 auto}
.tl-side{position:sticky;top:0;align-self:start;display:flex;flex-direction:column;gap:14px;z-index:4}
.tl-globe{position:relative;width:230px;height:230px;margin:0 auto}
.tl-globe canvas{width:100%;height:100%;display:block;border-radius:50%;border:2.5px solid var(--ink);box-shadow:0 14px 26px var(--glow)}
.tl-big{position:absolute;right:-14px;bottom:-6px;background:var(--sun);color:var(--on);border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);font-family:var(--font-display);font-weight:700;font-size:40px;line-height:1;padding:2px 12px;rotate:-6deg;border-radius:var(--wob)}
.tl-big.tick{animation:stamp .4s cubic-bezier(.3,1.6,.5,1)}
.tl-years{position:relative;display:flex;flex-direction:column;gap:2px;max-height:calc(100vh - 480px);min-height:90px;overflow:auto;padding:4px}
.tl-years button{border:0;background:none;display:flex;align-items:center;gap:10px;padding:3px 10px;font-family:var(--font-display);font-size:26px;font-weight:700;color:var(--ink-2);border-radius:var(--wob);text-align:left;line-height:1.05;transition:translate .15s}
.tl-years button span{font-family:var(--font-mono);font-size:10px;font-weight:400;margin-left:auto}
.tl-years button:hover{color:var(--ink);translate:3px 0}
.tl-years button[aria-current="true"]{background:var(--ink);color:var(--surface);rotate:-1.5deg}
.tl-ctl{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.tl-main{display:flex;flex-direction:column;gap:18px;min-width:0}
.tl-line{border-left:3px dashed var(--line);margin-left:10px;padding-left:28px;display:flex;flex-direction:column;gap:44px;padding-bottom:40vh}
.tl-year{position:relative;display:flex;flex-direction:column;gap:12px;scroll-margin-top:12px}
.tl-year::before{content:"";position:absolute;left:-41px;top:14px;width:22px;height:22px;border-radius:50%;background:var(--visit);border:2.5px solid var(--ink);transition:scale .3s,background .3s}
.tl-year.on::before{scale:1.35;background:var(--sun)}
.tl-yh{font-size:92px;line-height:.8;align-self:flex-start;transition:color .3s;color:var(--ink-2)}
.tl-year.on .tl-yh{color:var(--ink)}
.tl-stats{font-family:var(--font-mono);font-size:12px;color:var(--ink-2);margin:0;text-transform:uppercase;letter-spacing:.05em}
.tl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:30px 24px;padding-top:10px}
.tl-card{display:flex;flex-direction:column;gap:8px;min-width:0}
.tl-card .card{width:100%}
.tl-mem{border:0;background:var(--note-y);color:var(--note-ink);text-align:left;padding:6px 10px;font-family:var(--font-display);font-size:20px;line-height:1.05;font-weight:700;box-shadow:0 3px 8px rgba(70,50,20,.14);rotate:.6deg;transition:rotate .2s,translate .2s;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tl-mem:nth-child(odd){background:var(--note-b);rotate:-.8deg}
.tl-mem:hover{rotate:0deg;translate:0 -2px}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(30,22,40,.55);display:grid;place-items:center;z-index:50;padding:16px;backdrop-filter:blur(3px);animation:fade .2s ease both}
.modal{background:var(--surface);border-radius:4px;border:2px solid var(--ink);width:min(720px,100%);max-height:calc(100% - 20px);overflow-y:auto;padding:26px 24px 24px;display:flex;flex-direction:column;gap:16px;box-shadow:8px 8px 0 rgba(20,14,30,.5);animation:dropin .4s cubic-bezier(.2,.9,.3,1.15) both}
.modal h2{font-size:46px}
.modal .foot{display:flex;justify-content:flex-end;gap:10px;position:sticky;bottom:-24px;background:var(--surface);padding:14px 4px 8px;margin-bottom:-4px;border-top:2px dashed var(--line);z-index:3}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mic-zone{display:flex;gap:16px;align-items:center;padding:16px;border-radius:14px;background:var(--surface-2);border:2px dashed var(--line)}
.mic{width:68px;height:68px;border-radius:50%;border:2.5px solid var(--ink);background:var(--visit);color:var(--on);display:grid;place-items:center;flex:none;box-shadow:3px 3px 0 var(--ink);position:relative;transition:translate .12s,box-shadow .12s}
.mic:active{translate:2px 2px;box-shadow:1px 1px 0 var(--ink)}
.mic svg{width:28px;height:28px}
.mic.live{background:var(--visit-2);color:#fff}
.mic.live::before,.mic.live::after{content:"";position:absolute;inset:-7px;border-radius:50%;border:3px solid var(--visit-2);animation:ring 1.4s ease-out infinite}
.mic.live::after{animation-delay:.7s}
.wave{display:inline-flex;gap:3px;align-items:center;height:18px;margin-left:8px;vertical-align:middle}
.wave i{width:4px;border-radius:2px;background:var(--visit-2);height:100%;animation:wave .9s ease-in-out infinite;transform-origin:center}
.wave i:nth-child(2){animation-delay:.15s}.wave i:nth-child(3){animation-delay:.3s}.wave i:nth-child(4){animation-delay:.45s}.wave i:nth-child(5){animation-delay:.6s}
.prompt{font-family:var(--font-display);font-size:24px;line-height:1.1;color:var(--ink);min-height:1.1em}
.prompt.swap{animation:rise .35s ease backwards}
.cover-list{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.cv{border:2px dashed var(--line);background:none;border-radius:999px;padding:3px 11px;font-size:13px;font-weight:700;color:var(--ink-2);display:inline-flex;gap:6px;align-items:center;transition:background .25s,border-color .25s,color .25s}
.cv i{font-style:normal;width:16px;height:16px;border-radius:50%;border:2px solid currentColor;display:grid;place-items:center;font-size:11px;line-height:1}
.cv:hover{border-color:var(--ink);color:var(--ink)}
.cv.ok{background:var(--note-g);border:2px solid var(--ink);color:var(--note-ink)}
.cv.ok i{background:var(--mint);border-color:var(--ink);color:#fff;animation:pop .35s cubic-bezier(.3,1.8,.5,1)}
.partial{font-style:italic;color:var(--ink-2);font-size:14px;min-height:1.5em}
.board{display:flex;flex-direction:column;gap:14px;padding:16px;border:2px solid var(--ink);border-radius:12px;background:color-mix(in srgb,var(--surface-2) 45%,var(--surface));position:relative}
.board-h{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.board-h h3{font-size:34px}
.board-h .muted{font-size:13px;flex:1;min-width:120px}
.notes3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.note ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.note li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px;align-items:start}
.note li.new{animation:rise .3s ease backwards}
.note textarea{background:none;border:0;border-bottom:1.5px dashed color-mix(in srgb,var(--note-ink) 35%,transparent);border-radius:0;padding:3px 2px;font-size:14px;line-height:1.35;color:var(--note-ink);min-height:0;resize:none;field-sizing:content;font-weight:500}
.note textarea:focus{border-bottom-style:solid;border-bottom-color:var(--note-ink)}
.note .x{color:color-mix(in srgb,var(--note-ink) 60%,transparent)}
.note-add{border:0;background:none;color:color-mix(in srgb,var(--note-ink) 70%,transparent);font-weight:700;font-size:13px;text-align:left;padding:2px}
.note-add:hover{color:var(--note-ink)}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px}
.photos .ph-item{position:relative;aspect-ratio:1;overflow:hidden;background:var(--photo);border:5px solid var(--photo);box-shadow:0 3px 8px rgba(70,50,20,.2)}
.photos .ph-item:nth-child(odd){rotate:-2deg}.photos .ph-item:nth-child(even){rotate:1.5deg}
.photos .ph-item img{width:100%;height:100%;object-fit:cover}
.photos .ph-item button{position:absolute;top:2px;right:2px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;line-height:1}
.photo-add{aspect-ratio:1;border-radius:10px;border:2px dashed var(--line);display:grid;place-items:center;color:var(--ink-2);font-size:13px;font-weight:700;text-align:center;cursor:pointer;padding:6px}
.photo-add:hover{border-color:var(--ink);color:var(--ink)}
.tagbtn{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:700;transition:rotate .15s}
.tagbtn[aria-pressed="true"]{background:var(--mint);color:var(--on);border-color:var(--ink);rotate:-2deg}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px;padding:6px}
.gallery img{width:100%;aspect-ratio:1;object-fit:cover;cursor:zoom-in;border:7px solid var(--photo);border-bottom-width:20px;box-shadow:var(--shadow);transition:rotate .2s,scale .2s}
.gallery img:nth-child(odd){rotate:-2deg}.gallery img:nth-child(even){rotate:1.6deg}
.gallery img:hover{rotate:0deg;scale:1.04}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:60;display:grid;place-items:center;padding:20px;animation:fade .2s both}
.lightbox img{max-width:100%;max-height:100%;border:10px solid #fff;border-bottom-width:34px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));translate:-50% 0;background:var(--ink);color:var(--surface);padding:10px 18px;border-radius:var(--wob);font-weight:700;z-index:70;box-shadow:var(--shadow);max-width:calc(100% - 32px);text-align:center;animation:toastin .35s cubic-bezier(.2,.9,.3,1.3) both}
.spinner{width:16px;height:16px;border-radius:50%;border:2.5px solid currentColor;border-right-color:transparent;animation:spin .8s linear infinite;display:inline-block}
#sync-pill{cursor:pointer}#sync-pill[data-st=ok]{background:var(--note-g);color:var(--note-ink)}#sync-pill[data-st=error],#sync-pill[data-st=auth]{background:var(--note-p);color:var(--note-ink)}
.seg-toggle{display:inline-flex;border:2px solid var(--ink);border-radius:var(--wob);padding:2px;background:var(--surface);align-self:flex-start}
.seg-toggle button{border:0;background:none;border-radius:var(--wob);padding:5px 14px;font-weight:700;color:var(--ink-2)}
.seg-toggle button[aria-pressed="true"]{background:var(--sun);color:var(--on)}
.confetti{position:fixed;left:0;top:0;width:10px;height:14px;z-index:80;pointer-events:none;animation:confetti var(--d,1.4s) cubic-bezier(.2,.6,.4,1) forwards}

/* Trips */
.route{fill:none;stroke:var(--ink);stroke-width:2.5;stroke-dasharray:7 7;stroke-linecap:round;animation:march 1.2s linear infinite;pointer-events:none}
.ticket{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;text-align:left;width:100%;padding:10px 14px;background:var(--surface);color:var(--ink);border:2px solid var(--ink);border-radius:10px;box-shadow:3px 3px 0 var(--ink);transition:translate .15s,rotate .15s,box-shadow .15s}
.ticket:hover{translate:-1px -1px;rotate:-.6deg;box-shadow:4px 4px 0 var(--ink)}
.ticket .t,.ticket .r{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ticket .t{font-family:var(--font-display);font-weight:700;font-size:28px;line-height:1.05}
.ticket .r{font-family:var(--font-mono);font-size:11px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.04em}
.ticket .yr{font-family:var(--font-display);font-weight:700;font-size:32px;line-height:1;border-left:2px dashed var(--line);padding-left:12px;align-self:stretch;display:grid;place-items:center}
.trip-band{border:2px dashed var(--ink);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px;background:color-mix(in srgb,var(--sun) 12%,transparent)}
.stop-n{width:24px;height:24px;border-radius:50%;background:var(--sun);color:var(--on);border:2px solid var(--ink);display:grid;place-items:center;font-family:var(--font-mono);font-size:12px;line-height:1;flex:none;padding-top:2px}
.qp.sel{background:var(--sun);color:var(--on)}.qp.sel i{background:var(--ink);color:var(--surface);font-family:var(--font-mono);font-size:11px}
.fan{display:flex;justify-content:center;padding:10px 0 4px}
.fan img{width:36%;aspect-ratio:1;object-fit:cover;border:6px solid var(--photo);border-bottom-width:18px;box-shadow:var(--shadow);margin:0 -3%}
.fan img:nth-child(1){rotate:-6deg}.fan img:nth-child(2){rotate:3deg;z-index:1}.fan img:nth-child(3){rotate:8deg}
@keyframes march{to{stroke-dashoffset:-14}}

/* Arriving on a page: things land one after another */
.enter :is(.card,.section,.rank,.wish-card,.tl-year,.stamp,.panel-card,.otd,.cover-fig,.scorecard){animation:rise .5s cubic-bezier(.2,.8,.3,1.15) backwards}
.enter :is(.card,.section,.rank,.wish-card,.stamp,.tl-card):nth-child(2){animation-delay:.06s}
.enter :is(.card,.section,.rank,.wish-card,.stamp,.tl-card):nth-child(3){animation-delay:.12s}
.enter :is(.card,.section,.rank,.wish-card,.stamp,.tl-card):nth-child(4){animation-delay:.18s}
.enter :is(.card,.section,.rank,.wish-card,.stamp,.tl-card):nth-child(5){animation-delay:.24s}
.enter :is(.card,.section,.rank,.wish-card,.stamp,.tl-card):nth-child(6){animation-delay:.3s}
.enter :is(.card,.section,.rank,.wish-card,.stamp,.tl-card):nth-child(n+7){animation-delay:.36s}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.96)}}
@keyframes viewin{from{opacity:0;transform:translateY(8px)}}
@keyframes fade{from{opacity:0}}
@keyframes dropin{from{opacity:0;transform:translateY(-30px) rotate(-3deg) scale(.96)}}
@keyframes toastin{from{opacity:0;transform:translateY(20px) rotate(3deg)}}
@keyframes stamp{from{opacity:0;transform:scale(2.2) rotate(8deg)}}
@keyframes tape{from{opacity:0;transform:translateY(-10px) scaleX(.3)}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes pop{from{transform:scale(0)}}
@keyframes bob{50%{transform:rotate(180deg)}}
@keyframes pulse{0%{r:6;opacity:.9}100%{r:22;opacity:0}}
@keyframes ring{from{transform:scale(.9);opacity:1}to{transform:scale(1.35);opacity:0}}
@keyframes wave{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes confetti{from{transform:translate(var(--x0),var(--y0)) rotate(0)}to{transform:translate(var(--x1),var(--y1)) rotate(var(--rz));opacity:0}}

@media (max-width:900px){
  .stats{display:none}
  .globe-view{grid-template-columns:1fr;grid-template-rows:50% 50%}
  .panel{border-left:0;border-top:2px solid var(--ink);border-radius:22px 22px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) 120px max(16px,env(safe-area-inset-left,0px));box-shadow:0 -8px 20px rgba(70,50,20,.1)}
  .panel h2{font-size:42px}
  nav.tabs{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom,0px));left:50%;translate:-50% 0;z-index:40;box-shadow:3px 3px 0 var(--ink);border:2px solid var(--ink);background:var(--surface);border-radius:999px;padding:4px 6px;gap:2px;max-width:calc(100% - 16px);overflow-x:auto}
  nav.tabs a{padding:5px 7px;font-size:12.5px}
  nav.tabs a[aria-current="page"]{box-shadow:none}
  header.top{gap:8px;flex-wrap:nowrap}
  .brand{gap:7px;min-width:0}
  .brand h1{font-size:28px}
  .brand-mark{width:30px;height:30px}
  .actions{gap:8px}
  .actions .btn{padding:6px 10px}
  .actions{margin-left:auto}
  .actions .btn .lbl{display:none}
  .legend{display:none}
  .page-h h2{font-size:54px}
  .rank{grid-template-columns:34px minmax(0,1fr) 44px}

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
<script>
"use strict";
/* ---------- constants ---------- */
const CATS=[
  {k:'live',label:'Could I live here?',short:'Live here'},
  {k:'food',label:'Food',short:'Food'},
  {k:'people',label:'People',short:'People'},
  {k:'sights',label:'Attractions',short:'Attractions'},
  {k:'nature',label:'Nature',short:'Nature'},
  {k:'nightlife',label:'Nightlife',short:'Nightlife'},
  {k:'value',label:'Value for money',short:'Value'},
  {k:'safety',label:'Safety',short:'Safety'},
  {k:'transport',label:'Getting around',short:'Getting around'},
  {k:'vibe',label:'Vibe',short:'Vibe'}];
const TAGS=['Moment','Food','People','Sport & events','Nature','Culture','Nightlife','Adventure'];
const TODO_TYPES=['landmark','sport','event','experience','food','nature'];
const PLACES='wb/journal/places', MEMS='wb/journal/memories';
const WORLD=195;

/* ---------- state ---------- */
const S={places:[],memories:[],db:null,assets:null,sample:null,dict:null,user:null,
  loaded:{p:false,m:false},dbState:'loading',view:'globe',sel:null,mode:'visited',
  journalFilter:'All',rankCat:'overall',rankBy:'cities',h2h:[null,null],
  suggestions:{},dictTarget:null,pick:null,trips:[],journalQ:'',recs:{},recsOpen:{},tlOrder:'asc',panelKey:''};

/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-5);
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const blob=id=>B.url(id);
const fmtDate=s=>{if(!s)return'';const d=new Date(s+'T12:00:00');return isNaN(d)?s:d.toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'})};
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const place=id=>S.places.find(p=>p.id===id);
const memsOf=id=>S.memories.filter(m=>m.placeId===id).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
function overall(p){const v=CATS.map(c=>p.ratings?.[c.k]).filter(x=>typeof x==='number');return v.length?v.reduce((a,b)=>a+b,0)/v.length:null}
function score(p,k){return k==='overall'?overall(p):(typeof p.ratings?.[k]==='number'?p.ratings[k]:null)}
const f1=n=>n==null?'–':(Math.round(n*10)/10).toFixed(n%1===0?0:1);
function toast(msg,ms=3200){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),ms)}
function rateColor(v){const s=d3.scaleLinear().domain([1,5.5,10]).range([css('--sun'),css('--visit'),css('--visit-2')]).interpolate(d3.interpolateLab);return s(v)}
function initials(s){return (s||'?').trim().charAt(0).toUpperCase()}
function gradFor(s){const cs=['--visit','--visit-2','--wish','--mint','--sun'];let h=0;for(const c of (s||''))h=(h*31+c.charCodeAt(0))>>>0;const a=css(cs[h%5]),b=css(cs[(h+2)%5]);return `linear-gradient(135deg,${a},${b})`}
function aiErr(e){const c=e?.code;if(c==='no_key'||c==='bad_key'){openSettings();return c==='bad_key'?'That API key was rejected. Check it and try again.':'Add your Claude API key to switch on the AI features.'}if(c==='not_granted')return'AI is switched off for Wonderbook. Turn it on in the page’s Permissions menu.';if(c==='rate_limited')return'AI is busy right now. Try again in a minute.';return'AI could not finish that. Try again.'}
const ICON={mic:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>',
stop:'<svg viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="7" width="10" height="10" rx="2"/></svg>',
spark:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l1.8 6.2L20 10l-6.2 1.8L12 18l-1.8-6.2L4 10l6.2-1.8z"/></svg>',
star:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>'};

/* ---------- db ---------- */
async function savePlace(id,data){try{await B.updatePlace(id,data)}catch(e){toast('Could not save. Try again.')}}
function countryForPoint(lng,lat){for(const f of G.features){if(d3.geoContains(f,[lng,lat]))return f}return null}

/* ---------- globe ---------- */
const G={rot:[-10,-22,0],k:1,last:{x:0,y:0,k:1},features:[],spin:null,w:0,h:0,base:1};
async function initGlobe(){
  const wrap=$('#globe');
  const svg=d3.select(wrap).insert('svg',':first-child').attr('role','img').attr('aria-label','Interactive globe of places you have visited');
  const defs=svg.append('defs');
  const rg=defs.append('radialGradient').attr('id','oc').attr('cx','38%').attr('cy','32%').attr('r','75%');
  rg.append('stop').attr('offset','0%').attr('style','stop-color:var(--ocean)');
  rg.append('stop').attr('offset','100%').attr('style','stop-color:var(--ocean-2)');
  G.svg=svg;G.proj=d3.geoOrthographic().clipAngle(90).precision(.4);G.path=d3.geoPath(G.proj);
  G.sphere=svg.append('path').datum({type:'Sphere'}).attr('class','sphere').attr('fill','url(#oc)');
  G.grat=svg.append('path').datum(d3.geoGraticule10()).attr('class','grat');
  G.gC=svg.append('g');G.route=svg.append('path').attr('class','route');G.gP=svg.append('g');
  try{
    const topo=await fetch('countries-110m.json').then(r=>r.json());
    G.features=topojson.feature(topo,topo.objects.countries).features.filter(f=>f.properties.name!=='Antarctica');
  }catch(e){G.features=[];toast('The world map did not load. Reload the page to try again.')}
  G.countries=G.gC.selectAll('path').data(G.features,d=>d.id).join('path').attr('class','country')
    .on('click',(ev,d)=>onCountryClick(ev,d))
    .on('mousemove',(ev,d)=>showTip(ev,d.properties.name)).on('mouseleave',hideTip);
  G.zoom=d3.zoom().scaleExtent([1,16]).clickDistance(6)
    .on('start',ev=>{if(ev.sourceEvent)stopSpin()})
    .on('zoom',ev=>{const t=ev.transform;
      if(ev.sourceEvent&&Math.abs(G.last.k-t.k)<1e-6){const s=.28/t.k;G.rot[0]+=(t.x-G.last.x)*s;G.rot[1]=Math.max(-85,Math.min(85,G.rot[1]-(t.y-G.last.y)*s))}
      G.last={x:t.x,y:t.y,k:t.k};G.k=t.k;render()});
  svg.call(G.zoom).on('dblclick.zoom',null);
  new ResizeObserver(()=>{resize();render()}).observe(wrap);
  resize();startSpin();
}
function resize(){if(!G.svg)return;const r=$('#globe').getBoundingClientRect();G.w=r.width;G.h=r.height;G.base=Math.min(r.width,r.height)/2*.86;G.svg.attr('viewBox',`0 0 ${r.width} ${r.height}`)}
function startSpin(){stopSpin();if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;G.spin=d3.timer(()=>{G.rot[0]+=.07;render()})}
function stopSpin(){if(G.spin){G.spin.stop();G.spin=null}}
function visibleAt(lng,lat){return d3.geoDistance([lng,lat],[-G.rot[0],-G.rot[1]])<Math.PI/2-.02}
function render(){
  if(!G.proj||!G.w)return;
  G.proj.translate([G.w/2,G.h/2]).scale(G.base*G.k).rotate(G.rot);
  G.sphere.attr('d',G.path);G.grat.attr('d',G.path);
  const agg=countryAgg();
  G.countries.attr('d',G.path).attr('fill',d=>fillFor(agg.get(d.id))).classed('sel',d=>S.sel?.type==='country'&&S.sel.id===d.id);
  const tsel=S.sel?.type==='trip'?trip(S.sel.id):null,tids=new Set(tsel?.placeIds||[]);
  const rc=tsel?tripPlaces(tsel).filter(p=>typeof p.lat==='number').map(p=>[p.lng,p.lat]):[];
  G.route.attr('d',rc.length>1?G.path({type:'LineString',coordinates:rc}):null);
  const pts=S.places.filter(p=>typeof p.lat==='number'&&p.kind!=='country');
  const g=G.gP.selectAll('g.city').data(pts,d=>d.id).join(en=>{const e=en.append('g').attr('class','city');e.append('circle').attr('class','ring').attr('r',6);e.append('circle').attr('class','dot');e.append('text').attr('dx',9).attr('dy',4);e.on('click',(ev,d)=>{ev.stopPropagation();selectPlace(d.id,true)}).on('mousemove',(ev,d)=>showTip(ev,d.name)).on('mouseleave',hideTip);return e});
  g.attr('class',d=>`city ${d.status==='wishlist'?'wish':'visited'}${S.sel?.type==='place'&&S.sel.id===d.id?' sel':''}`)
   .attr('display',d=>visibleAt(d.lng,d.lat)?null:'none')
   .attr('transform',d=>{const p=G.proj([d.lng,d.lat]);return p?`translate(${p[0]},${p[1]})`:null});
  g.select('.dot').attr('r',d=>S.sel?.id===d.id?7:Math.min(6,3.5+G.k*.4));
  g.select('text').text(d=>(G.k>=2.4||S.sel?.id===d.id||tids.has(d.id))?d.name:'');
}
function countryAgg(){const m=new Map();for(const p of S.places){if(!p.countryId)continue;let a=m.get(p.countryId);if(!a){a={visited:false,wish:false,sc:[],live:[],years:[]};m.set(p.countryId,a)}
  if(p.status==='visited'){a.visited=true;const o=overall(p);if(o!=null)a.sc.push(o);if(typeof p.ratings?.live==='number')a.live.push(p.ratings.live);(p.years||[]).forEach(y=>a.years.push(+y))}else a.wish=true}
  for(const a of m.values()){a.avg=a.sc.length?d3.mean(a.sc):null;a.liveAvg=a.live.length?d3.mean(a.live):null;a.first=a.years.length?d3.min(a.years):null}return m}
function yearRange(){const ys=S.places.flatMap(p=>p.status==='visited'?(p.years||[]).map(Number):[]);return ys.length?[d3.min(ys),d3.max(ys)]:[2020,2026]}
function fillFor(a){const land=css('--land');if(!a)return land;
  if(!a.visited)return a.wish?d3.color(css('--wish')).copy({opacity:.45})+'':land;
  if(S.mode==='visited')return css('--visit');
  if(S.mode==='rating')return a.avg!=null?rateColor(a.avg):d3.color(css('--visit')).copy({opacity:.35})+'';
  if(S.mode==='live')return a.liveAvg!=null?rateColor(a.liveAvg):d3.color(css('--visit')).copy({opacity:.35})+'';
  if(S.mode==='year'){const [a0,a1]=yearRange();if(a.first==null)return d3.color(css('--visit')).copy({opacity:.35})+'';const t=a1===a0?1:(a.first-a0)/(a1-a0);return d3.interpolateLab(css('--mint'),css('--wish'))(t)}
  return css('--visit')}
function flyTo(lng,lat,k){stopSpin();const r0=G.rot.slice(),r1=[-lng,-lat,0],k0=G.k,k1=k??Math.max(G.k,3.2);
  const ri=d3.interpolate(r0,r1);
  d3.transition().duration(1100).ease(d3.easeCubicInOut).tween('fly',()=>t=>{G.rot=ri(t);G.k=k0+(k1-k0)*t;render()})
   .on('end',()=>{G.svg.call(G.zoom.transform,d3.zoomIdentity.translate(G.last.x,G.last.y).scale(G.k))})}
function zoomBy(f){stopSpin();const k1=Math.max(1,Math.min(16,G.k*f));const k0=G.k;d3.transition().duration(350).tween('z',()=>t=>{G.k=k0+(k1-k0)*t;render()}).on('end',()=>G.svg.call(G.zoom.transform,d3.zoomIdentity.translate(G.last.x,G.last.y).scale(G.k)))}
function showTip(ev,txt){const t=$('#tip');const r=$('#globe').getBoundingClientRect();t.textContent=txt;t.style.left=(ev.clientX-r.left)+'px';t.style.top=(ev.clientY-r.top)+'px';t.style.opacity=1}
function hideTip(){$('#tip').style.opacity=0}
function onCountryClick(ev,d){
  if(S.pick){const [lng,lat]=G.proj.invert(d3.pointer(ev,G.svg.node()));finishPick(lng,lat,d);return}
  S.sel={type:'country',id:d.id,name:d.properties.name};const c=d3.geoCentroid(d);flyTo(c[0],c[1],Math.max(G.k,2));renderPanel();render()}
function renderModes(){const modes=[['visited','Visited'],['rating','Rating'],['live','Live here'],['year','First visit']];
  $('#modes').innerHTML=modes.map(([k,l])=>`<button class="chip" data-act="mode" data-mode="${k}" aria-pressed="${S.mode===k}">${l}</button>`).join('');
  const lg=$('#legend');const ramp=`<div class="ramp" style="background:linear-gradient(90deg,${rateColor(1)},${rateColor(5.5)},${rateColor(10)})"></div>`;
  const wish=`<div class="row"><span class="sw" style="background:${d3.color(css('--wish')).copy({opacity:.45})}"></span>Want to go</div>`;
  if(S.mode==='visited')lg.innerHTML=`<div class="row"><span class="sw" style="background:var(--visit)"></span>Been there</div>${wish}`;
  else if(S.mode==='year'){const [a,b]=yearRange();lg.innerHTML=`<div class="row mono">${a}<div class="ramp" style="background:linear-gradient(90deg,var(--mint),var(--wish))"></div>${b}</div>${wish}`}
  else lg.innerHTML=`<div>${S.mode==='rating'?'Average rating':'Could I live here?'}</div><div class="row mono">1${ramp}10</div>${wish}`}

/* ---------- pick on globe (fallback when AI can't place a city) ---------- */
function startPick(draft){S.pick=draft;go('globe');const b=$('#pick');b.hidden=false;b.innerHTML=`Tap the map where ${esc(draft.name)} is <button class="btn sm" data-act="cancel-pick">Cancel</button>`}
function finishPick(lng,lat,feature){const d=S.pick;S.pick=null;$('#pick').hidden=true;createPlace({...d,lat,lng,country:d.country||feature?.properties.name||'',countryId:feature?.id||null})}
$('#globe').addEventListener('click',ev=>{if(!S.pick||ev.target.closest('.country,button'))return;const p=G.proj.invert(d3.pointer(ev,G.svg.node()));if(p)finishPick(p[0],p[1],countryForPoint(p[0],p[1]))});

/* ---------- panel ---------- */
function selectPlace(id,fly){const p=place(id);if(!p)return;S.sel={type:'place',id};if(S.view!=='globe')go('globe');if(fly&&typeof p.lat==='number')flyTo(p.lng,p.lat,Math.max(G.k,p.kind==='country'?2:3.4));renderPanel();render();$('#panel').scrollTop=0}
function renderPanel(){const el=$('#panel');
  if(S.dbState!=='ready'){el.innerHTML=dbStateHTML();return}
  const key=S.sel?S.sel.type+':'+S.sel.id:'home';if(key!==S.panelKey){S.panelKey=key;enter(el)}
  if(S.sel?.type==='place'&&place(S.sel.id))el.innerHTML=placeHTML(place(S.sel.id));
  else if(S.sel?.type==='trip'&&trip(S.sel.id))el.innerHTML=tripHTML(trip(S.sel.id));
  else if(S.sel?.type==='country')el.innerHTML=countryHTML(S.sel);
  else el.innerHTML=overviewHTML()}
function dbStateHTML(){if(S.dbState==='loading')return`<div class="stack"><span class="eyebrow">Wonderbook</span><h2>Opening your journal…</h2><p class="muted"><span class="spinner"></span></p></div>`;
  if(S.dbState==='private')return`<div class="stack"><span class="eyebrow">Private</span><h2>This journal is private</h2><p class="muted">Only its owner can open the memories in Wonderbook.</p></div>`;
  return`<div class="stack"><span class="eyebrow">Can’t connect</span><h2>Your journal didn’t load</h2><p class="muted">Reload the page to try again.</p></div>`}
function exampleBanner(){return S.places.some(p=>p.example)||S.memories.some(m=>m.example)?`<div class="banner"><span>Some entries are examples to show how Wonderbook works.</span><button class="btn sm" data-act="clear-examples">Remove examples</button></div>`:''}
function overviewHTML(){
  const v=S.places.filter(p=>p.status==='visited'),w=S.places.filter(p=>p.status==='wishlist');
  const top=v.filter(p=>overall(p)!=null).sort((a,b)=>overall(b)-overall(a)).slice(0,5);
  const recent=[...S.memories].sort((a,b)=>(b.date||'').localeCompare(a.date||'')).slice(0,4);
  if(!S.places.length)return`<div class="stack"><span class="eyebrow">Welcome</span><h2>Start your Wonderbook</h2><p class="muted">Add the first place you’ve been. It lights up on the globe, and you can add memories, photos and ratings to it.</p><div class="empty"><b>No places yet</b><button class="btn primary" data-act="add-place">Add your first place</button></div></div>`;
  return`<div class="stack">${exampleBanner()}<div><span class="eyebrow">Your world</span><h2>${(n=>n+(n===1?' country':' countries'))(countryCount())}, ${(n=>n+(n===1?' city':' cities'))(v.filter(p=>p.kind!=='country').length)}</h2><p class="muted">Spin the globe, tap a country or a pin to open its page.</p></div>
  ${stampsHTML()}
  ${tripsSectionHTML()}
  <div class="section"><div class="section-h"><h3>Top rated</h3><a class="btn sm ghost" href="#rankings">All rankings</a></div><div class="list">${top.length?top.map((p,i)=>placeRow(p,`<span class="mono" style="font-weight:700">${f1(overall(p))}</span>`)).join(''):'<p class="muted">Rate a place to see it here.</p>'}</div></div>
  <div class="section"><div class="section-h"><h3>Latest memories</h3><a class="btn sm ghost" href="#journal">Journal</a></div><div class="list">${recent.length?recent.map(memRow).join(''):'<p class="muted">No memories yet. Tap “New memory” and talk about a trip.</p>'}</div></div>

const GENERIC=[['Ate the local speciality','food'],['Walked the old town','experience'],['Watched a live match','sport'],['Sunset viewpoint','experience'],['Local market','experience'],['Night out','experience'],['Main museum','landmark'],['Street food crawl','food'],['Day trip nearby','experience'],['Stadium tour','sport'],['Festival or concert','event'],['Beach day','nature'],['Hike or big walk','nature'],['Found a favourite coffee spot','food']];
const REC_TYPES=[['sport',/stadium|arena|ballpark|racecourse|race track|racing (circuit|venue)|velodrome|cricket ground|football ground|sports venue|(football|soccer|rugby|cricket|basketball|baseball|hockey|sports) (club|team)/],
  ['event',/festival|carnival|parade/],
  ['food',/\b(market|food hall|restaurant|caf[eé]|brewery|distillery|winery|bakery)\b/],
  ['landmark',/museum|cathedral|church|temple|mosque|synagogue|palace|castle|tower|bridge|monument|square|basilica|\bfort(ress)?\b|gallery|theatre|theater|opera|landmark|shrine|memorial|statue|plaza|skyscraper|observation|ruins|archaeological|amphitheat|fountain|lighthouse|abbey|monastery|citadel|\bgate\b|world heritage|tourist attraction|historic|mausoleum|pagoda|\barch\b|promenade|boulevard|avenue|thoroughfare|street in|\bpier\b|concert hall|amusement park|theme park|cable car|ferris wheel|funicular|cemetery/],
  ['nature',/\b(park|garden|gardens|beach|mountain|lake|island|forest|hill|bay|waterfall|canyon|nature reserve|zoo|aquarium|volcano|cliff|canal|viewpoint)\b/]];
const REC_SKIP=/station|railway|metro line|subway|school|college|university|higher.education|district|neighbou?rhood|quarter of|municipality|suburb|borough|ward of|commune|village|town in|city in|capital of|company|corporation|manufacturer|hospital|airport|embassy|hotel|ministry|government|parliament|election|bombing|attack|shooting|murder|disaster|crash|riot|massacre|\bfire\b|explosion|earthquake|prison|politic|newspaper|television|radio|\bbank\b|airline|agency|headquarters|shopping (mall|centre|center)|office building|residential|constituency|diocese|disambiguation|human settlement|administrative|department store|tramway|road in|highway|motorway|\bwar\b|battle|siege|treaty|court|governing body|organi[sz]ation|republic|empire|kingdom|\b(1[0-9]|20)\d\d\b.*\b(1[0-9]|20)\d\d\b/;
/* The best-known places near a city, from Wikipedia: nearby articles, most linked-to first, kept only if they are somewhere you could go. */
async function wikiRecs(p){
  const url=off=>'https://en.wikipedia.org/w/api.php?origin=*&format=json&formatversion=2&action=query&generator=search&gsrsearch='+encodeURIComponent(`nearcoord:12km,${(+p.lat).toFixed(3)},${(+p.lng).toFixed(3)}`)+'&gsrlimit=50&gsrnamespace=0&gsrsort=incoming_links_desc&prop=description&gsroffset='+off;
  const rs=await Promise.all([0,50].map(o=>fetch(url(o)).then(r=>r.json()).catch(()=>({}))));
  const pages=rs.flatMap((r,i)=>(r.query?.pages||[]).map(pg=>({...pg,index:(pg.index||0)+i*1000}))).sort((a,b)=>a.index-b.index);
  if(!pages.length)throw new Error('none');
  const out=[],seen=new Set();
  for(const o of pages){const d=(o.description||'').toLowerCase(),name=o.title.replace(/\s*\([^)]*\)$/,'').replace(/,.*$/,''),ln=name.toLowerCase();
    if(!d||REC_SKIP.test(d)||/^\d{4}\b|^list of|station$/i.test(o.title))continue;
    if(ln===p.name.toLowerCase()||ln===String(p.country).toLowerCase()||seen.has(ln))continue;
    const t=REC_TYPES.find(([,re])=>re.test(ln+' '+d));if(!t)continue;
    seen.add(ln);out.push({name,type:t[0],note:o.description});if(out.length>=14)break}
  return out}
const recCache={get(id){try{const c=JSON.parse(localStorage.getItem('wb_recs')||'{}')[id];return c&&Date.now()-c.at<2592e6?c.items:null}catch(e){return null}},
  set(id,items){try{const c=JSON.parse(localStorage.getItem('wb_recs')||'{}');c[id]={at:Date.now(),items};localStorage.setItem('wb_recs',JSON.stringify(c))}catch(e){}}};
function loadRecs(p){if(S.recs[p.id]!==undefined||S.dbState!=='ready')return;const c=recCache.get(p.id);if(c){S.recs[p.id]=c;return}
  if(B.mode!=='local'||p.kind==='country'||typeof p.lat!=='number'){S.recs[p.id]=[];return}
  S.recs[p.id]='loading';
  wikiRecs(p).then(items=>{S.recs[p.id]=items;recCache.set(p.id,items)}).catch(()=>{S.recs[p.id]=[]})
    .finally(()=>{const q=place(p.id);if(q)document.querySelectorAll(`.quick[data-rid="${p.id}"]`).forEach(el=>el.outerHTML=recsHTML(q)||'')})}
function recsHTML(p){loadRecs(p);const st=S.recs[p.id];const have=new Set((p.todo||[]).map(t=>t.text.toLowerCase()));
  const local=(Array.isArray(st)?st:[]).filter(x=>!have.has(x.name.toLowerCase()));
  const gen=GENERIC.filter(([n])=>!have.has(n.toLowerCase())).map(([name,type])=>({name,type}));
  const open=S.recsOpen[p.id],nl=open?12:6,ng=open?14:(local.length?4:7);
  const shown=[...local.slice(0,nl),...gen.slice(0,ng)];
  if(!shown.length&&st!=='loading')return'';
  const chip=it=>`<button class="qp ${it.type}" data-act="quick-add" data-id="${p.id}" data-name="${esc(it.name)}" data-type="${it.type}" title="${esc(it.note||it.type)}"><i>+</i>${esc(it.name)}</button>`;
  return`<div class="quick" data-rid="${p.id}"><span class="eyebrow">${p.status==='visited'?'Quick picks · tap what you did':'Quick picks · tap to add to your list'}</span>
  <div class="quick-chips">${st==='loading'?'<span class="muted" style="font-size:13px"><span class="spinner"></span> Finding the famous spots…</span>':''}${shown.map(chip).join('')}</div>
  ${local.length>nl||gen.length>ng||open?`<button class="btn sm ghost" style="align-self:flex-start" data-act="recs-more" data-id="${p.id}">${open?'Show fewer':'More ideas'}</button>`:''}</div>`}

/* ---------- timeline ---------- */
const TL={obs:null,rot:[0,-15,0],k:1,timer:null,play:null,active:null,years:[]};
function timelineData(){const map=new Map();
  const add=(y,p)=>{if(!map.has(y))map.set(y,new Map());const m=map.get(y);if(!m.has(p.id))m.set(p.id,{p,ms:[]});return m.get(p.id)};
  for(const p of S.places){if(p.status!=='visited')continue;for(const y of p.years||[])if(+y)add(+y,p)}
  for(const m of S.memories){const p=place(m.placeId),y=+(m.date||'').slice(0,4);if(p&&y)add(y,p).ms.push(m)}
  const dated=new Set([...map.values()].flatMap(m=>[...m.keys()]));
  return{years:[...map.keys()].sort((a,b)=>a-b).map(y=>({y,items:[...map.get(y).values()]})),undated:S.places.filter(p=>p.status==='visited'&&!dated.has(p.id))}}
function tlCard({p,ms}){const ph=ms.find(m=>m.photos?.length)?.photos[0]||p.coverId;const o=overall(p);
  return`<div class="tl-card"><button class="card taped" data-act="open-place" data-id="${p.id}">${ph?`<img class="ph" src="${blob(ph)}" alt="" loading="lazy">`:`<div class="ph none" style="background:${gradFor(p.name)}">${esc(initials(p.name))}</div>`}<div class="body"><span class="t">${esc(p.name)}</span><span class="meta k">${esc(p.kind==='country'?'Country':p.country)}${o!=null?` · ${f1(o)}/10`:''}</span></div></button>${ms.slice(0,3).map(m=>`<button class="tl-mem" data-act="open-memory" data-id="${m.id}">${esc(m.title||'Untitled memory')}</button>`).join('')}${ms.length>3?`<span class="muted" style="font-size:12px">+${ms.length-3} more in the journal</span>`:''}</div>`}
function renderTimeline(){const el=$('#v-timeline');const{years,undated}=timelineData();
  const head=`<div class="page-h"><div><span class="eyebrow">${years.length?`${years.length} year${years.length>1?'s':''} of travel`:'Your travels, year by year'}</span><h2>Timeline</h2></div>${S.places.some(p=>p.status==='visited')?'<button class="btn" data-act="new-trip">+ New trip</button>':''}</div>`;
  TL.obs?.disconnect();
  if(!years.length){TL.years=[];el.innerHTML=`<div class="page-inner">${head}<div class="empty"><b>No years yet</b>Add a place you’ve been and the year you went. It lands here.<button class="btn primary" data-act="add-place" data-status="visited">Add a place</button></div></div>`;return}
  const seen=new Set(),firsts=new Map();for(const yr of years){const cs=new Set(yr.items.map(i=>i.p.countryId||i.p.country));firsts.set(yr.y,[...cs].filter(c=>!seen.has(c)).length);cs.forEach(c=>seen.add(c))}
  TL.years=years;const shown=S.tlOrder==='desc'?[...years].reverse():years;const pl=(n,a,b)=>`${n} ${n===1?a:b}`;
  el.innerHTML=`<div class="tl-wrap"><aside class="tl-side"><div class="tl-globe"><canvas id="tl-canvas" width="460" height="460" aria-hidden="true"></canvas><div class="tl-big" id="tl-big"></div></div>
  <div class="tl-years" id="tl-years">${shown.map(yr=>`<button data-act="tl-year" data-y="${yr.y}">${yr.y}<span>${pl(yr.items.length,'place','places')}</span></button>`).join('')}</div>
  <div class="tl-ctl"><button class="btn sm primary" data-act="tl-play" id="tl-play">${TL.play?'■ <span class="lbl">Stop</span>':'▶ <span class="lbl">Play my travels</span>'}</button><button class="btn sm" data-act="tl-order" title="Change the order">⇅ <span class="lbl">${S.tlOrder==='asc'?'Oldest first':'Newest first'}</span></button></div></aside>
  <div class="tl-main">${head}<div class="tl-line">${shown.map(yr=>{const cs=new Set(yr.items.map(i=>i.p.countryId||i.p.country)).size,mc=d3.sum(yr.items,i=>i.ms.length),nf=firsts.get(yr.y);
    return`<section class="tl-year" data-y="${yr.y}" id="tl-${yr.y}"><h3 class="tl-yh">${yr.y}</h3><p class="tl-stats">${pl(yr.items.length,'place','places')} · ${pl(cs,'country','countries')}${mc?' · '+pl(mc,'memory','memories'):''}${nf?' · '+pl(nf,'new country','new countries'):''}</p>${tlYearBody(yr)}</section>`}).join('')}
  ${undated.length?`<section class="tl-year" data-y="0"><h3 class="tl-yh" style="font-size:60px">Sometime</h3><p class="tl-stats">No year yet. Open a place and tap “+ year”.</p><div class="tl-grid">${undated.map(p=>tlCard({p,ms:[]})).join('')}</div></section>`:''}</div></div></div>`;
  TL.obs=new IntersectionObserver(es=>{for(const e of es)if(e.isIntersecting)tlActive(+e.target.dataset.y)},{root:el,rootMargin:'-30% 0px -69% 0px'});
  el.querySelectorAll('.tl-year').forEach(s=>{if(+s.dataset.y)TL.obs.observe(s)});
  tlActive(years.some(y=>y.y===TL.active)?TL.active:shown[0].y,true)}
function tlActive(y,force){if(!force&&TL.active===y)return;TL.active=y;const el=$('#v-timeline');
  el.querySelectorAll('.tl-year').forEach(s=>s.classList.toggle('on',+s.dataset.y===y));
  const box=$('#tl-years');el.querySelectorAll('#tl-years button').forEach(b=>{const on=+b.dataset.y===y;b.setAttribute('aria-current',on);
    if(on&&box)box.scrollTo({left:b.offsetLeft-box.clientWidth/2+b.clientWidth/2,top:b.offsetTop-box.clientHeight/2+b.clientHeight/2,behavior:'smooth'})});
  const big=$('#tl-big');if(big){big.textContent=y;big.classList.remove('tick');void big.offsetWidth;big.classList.add('tick')}
  tlGlobe(y)}
/* A small globe that turns to wherever that year took you. Earlier years stay faintly coloured, so the world fills in. */
function tlGlobe(y){const cv=$('#tl-canvas');const yr=TL.years.find(x=>x.y===y);if(!cv||!yr||!G.features.length)return;
  const ps=yr.items.map(i=>i.p).filter(p=>typeof p.lat==='number'),all=ps.map(p=>[p.lng,p.lat]),pins=ps.filter(p=>p.kind!=='country').map(p=>[p.lng,p.lat]);
  const now=new Set(yr.items.map(i=>String(i.p.countryId))),before=new Set(TL.years.filter(x=>x.y<y).flatMap(x=>x.items.map(i=>String(i.p.countryId))));
  const routes=S.trips.filter(t=>+t.year===y).map(t=>({type:'LineString',coordinates:tripPlaces(t).filter(p=>typeof p.lat==='number').map(p=>[p.lng,p.lat])})).filter(r=>r.coordinates.length>1);
  const c=all.length?d3.geoCentroid({type:'MultiPoint',coordinates:all}):[-TL.rot[0],-TL.rot[1]];
  const spread=all.length?d3.max(all,p=>d3.geoDistance(p,c)):1,k1=Math.max(1,Math.min(2.8,.75/(spread+.25)));
  const r0=TL.rot.slice(),k0=TL.k,dl=((-c[0]-r0[0])%360+540)%360-180,ri=d3.interpolate(r0,[r0[0]+dl,-c[1],0]);
  const ctx=cv.getContext('2d'),W=cv.width,proj=d3.geoOrthographic().clipAngle(90).translate([W/2,W/2]),path=d3.geoPath(proj,ctx);
  const col={ocean:css('--ocean'),land:css('--land'),line:css('--land-line'),now:css('--visit'),before:d3.color(css('--visit')).copy({opacity:.38})+'',pin:css('--visit-2'),ink:css('--ink')};
  const draw=t=>{TL.rot=ri(t);TL.k=k0+(k1-k0)*t;proj.rotate(TL.rot).scale(W/2*TL.k);
    ctx.fillStyle=col.ocean;ctx.fillRect(0,0,W,W);ctx.lineWidth=1;ctx.strokeStyle=col.line;
    for(const f of G.features){const id=String(f.id);ctx.beginPath();path(f);ctx.fillStyle=col.land;ctx.fill();if(now.has(id)||before.has(id)){ctx.fillStyle=now.has(id)?col.now:col.before;ctx.fill()}ctx.stroke()}
    ctx.setLineDash([9,9]);ctx.lineWidth=3;ctx.strokeStyle=col.ink;for(const r of routes){ctx.beginPath();path(r);ctx.stroke()}ctx.setLineDash([]);ctx.lineWidth=1;ctx.strokeStyle=col.line;
    for(const p of pins){if(d3.geoDistance(p,[-TL.rot[0],-TL.rot[1]])>1.5)continue;const q=proj(p);ctx.beginPath();ctx.arc(q[0],q[1],10,0,7);ctx.fillStyle=col.pin;ctx.fill();ctx.lineWidth=3;ctx.strokeStyle=col.ink;ctx.stroke();ctx.lineWidth=1;ctx.strokeStyle=col.line}};
  TL.timer?.stop();if(matchMedia('(prefers-reduced-motion: reduce)').matches){draw(1);return}
  const t0=performance.now();TL.timer=d3.timer(()=>{const t=Math.min(1,(performance.now()-t0)/900);draw(d3.easeCubicInOut(t));if(t>=1)TL.timer.stop()})}
function tlPlay(){const label=()=>{const b=$('#tl-play');if(b)b.innerHTML=TL.play?'■ <span class="lbl">Stop</span>':'▶ <span class="lbl">Play my travels</span>'};
  const stop=()=>{clearInterval(TL.play);TL.play=null;label()};
  if(TL.play){stop();return}
  const ys=[...$('#v-timeline').querySelectorAll('.tl-year')].map(s=>+s.dataset.y).filter(Boolean);let i=0;
  const step=()=>{if(S.view!=='timeline'||i>=ys.length){stop();return}$('#tl-'+ys[i])?.scrollIntoView({behavior:'smooth',block:'start'});i++};
  TL.play=setInterval(step,2600);label();step()}

/* ---------- trips: several places from one journey, with the route drawn between them ---------- */
function trip(id){return S.trips.find(t=>t.id===id)}
function tripPlaces(t){return(t.placeIds||[]).map(place).filter(Boolean)}
function tripMems(t){return S.memories.filter(m=>(t.placeIds||[]).includes(m.placeId)&&(!t.year||+(m.date||'').slice(0,4)===+t.year)).sort((a,b)=>(a.date||'').localeCompare(b.date||''))}
function tripAutoName(ps,year){ps=ps.filter(Boolean);const cs=[...new Set(ps.map(p=>p.country||p.name))];
  const n=cs.length===1?(ps.length===1?ps[0].name:cs[0]):cs.length===2?cs.join(' & '):cs.slice(0,2).join(', ')+' & more';return n+(year?' '+year:'')}
function ticketHTML(t){const ps=tripPlaces(t);return`<button class="ticket" data-act="open-trip" data-id="${t.id}"><span style="min-width:0"><span class="r">Trip · ${ps.length} stop${ps.length===1?'':'s'}</span><span class="t">${esc(t.name)}</span><span class="r">${ps.map(p=>esc(p.name)).join(' → ')}</span></span><span class="yr">${esc(t.year||'')}</span></button>`}
function tripsSectionHTML(){if(!S.places.some(p=>p.status==='visited'))return'';const ts=[...S.trips].sort((a,b)=>(+b.year||0)-(+a.year||0));
  return`<div class="section"><div class="section-h"><h3>Trips</h3><button class="btn sm" data-act="new-trip">+ New trip</button></div><div class="list">${ts.length?ts.map(ticketHTML).join(''):'<p class="muted" style="margin:0">Group the places from one journey, like “Japan 2019”, and see the route on the globe.</p>'}</div></div>`}
function tripHTML(t){const ps=tripPlaces(t),ms=tripMems(t),cs=new Set(ps.map(p=>p.countryId||p.country)).size,avg=d3.mean(ps.map(overall).filter(x=>x!=null)),ph=ms.flatMap(m=>m.photos||[]).slice(0,3);
  const pl=(n,a,b)=>`${n} ${n===1?a:b}`;
  return`<div class="stack"><button class="back" data-act="home">‹ Your world</button>
  ${ph.length?`<div class="fan">${ph.map(x=>`<img src="${blob(x)}" alt="">`).join('')}</div>`:''}
  <div><span class="eyebrow">Trip${t.year?' · '+esc(t.year):''}</span><h2>${esc(t.name)}</h2><p style="display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 0"><span class="pill">${pl(ps.length,'stop','stops')}</span><span class="pill">${pl(cs,'country','countries')}</span>${ms.length?`<span class="pill">${pl(ms.length,'memory','memories')}</span>`:''}${avg!=null?`<span class="pill">Average ${f1(avg)}/10</span>`:''}</p></div>
  ${t.note?`<div class="note y"><p style="margin:0">${esc(t.note)}</p></div>`:''}
  <div class="section"><div class="section-h"><h3>The route</h3></div><div class="list">${ps.map((p,i)=>`<button class="place-row" data-act="open-place" data-id="${p.id}"><span class="stop-n">${i+1}</span><span class="nm">${esc(p.name)}<span class="muted" style="font-weight:400"> · ${esc(p.kind==='country'?'Country':p.country)}</span></span>${overall(p)!=null?`<span class="mono" style="font-weight:700">${f1(overall(p))}</span>`:''}</button>`).join('')||'<p class="muted" style="margin:0">The places in this trip were deleted.</p>'}</div></div>
  <div class="section"><div class="section-h"><h3>Memories</h3></div><div class="list">${ms.length?ms.map(memRow).join(''):`<p class="muted" style="margin:0">No memories from ${t.year?esc(t.year):'this trip'} yet. Open a stop and record one.</p>`}</div></div>
  <div class="section" style="flex-direction:row;gap:10px;flex-wrap:wrap"><button class="btn sm" data-act="edit-trip" data-id="${t.id}">Edit trip</button><button class="btn sm ghost" data-act="del-trip" data-id="${t.id}" style="color:var(--visit)">Delete trip</button></div></div>`}
function selectTrip(id){const t=trip(id);if(!t)return;S.sel={type:'trip',id};if(S.view!=='globe')go('globe');
  const cs=tripPlaces(t).filter(p=>typeof p.lat==='number').map(p=>[p.lng,p.lat]);
  if(cs.length){const c=d3.geoCentroid({type:'MultiPoint',coordinates:cs}),sp=d3.max(cs,p=>d3.geoDistance(p,c));flyTo(c[0],c[1],Math.max(1,Math.min(6,.8/(sp+.12))))}
  renderPanel();render();$('#panel').scrollTop=0}
function tlYearBody(yr){const ts=S.trips.filter(t=>+t.year===yr.y&&tripPlaces(t).length),used=new Set(ts.flatMap(t=>t.placeIds)),by=new Map(yr.items.map(i=>[i.p.id,i]));
  const rest=yr.items.filter(i=>!used.has(i.p.id));
  return ts.map(t=>`<div class="trip-band">${ticketHTML(t)}<div class="tl-grid">${tripPlaces(t).map(p=>tlCard(by.get(p.id)||{p,ms:[]})).join('')}</div></div>`).join('')
    +(rest.length?`<div class="tl-grid">${rest.map(tlCard).join('')}</div>`:'')
    +(rest.length>=2?`<button class="btn sm" style="align-self:flex-start" data-act="new-trip" data-y="${yr.y}" data-ids="${rest.map(i=>i.p.id).join(',')}">+ Make these a trip</button>`:'')}
function openTripEditor(opts={}){const t=opts.trip;const visited=S.places.filter(p=>p.status==='visited');
  if(!visited.length){toast('Add a place you’ve been first.');openAddPlace({status:'visited'});return}
  let sel=(t?t.placeIds||[]:opts.placeIds||[]).filter(id=>place(id));
  const y0=t?t.year||'':opts.year||new Date().getFullYear();
  openModal(`<h2>${t?'Edit trip':'New trip'}</h2><p class="muted" style="margin:-8px 0 0">One journey, several stops. The route shows on the globe and in the timeline.</p>
  <div class="row2"><label class="field">Trip name<input type="text" id="t-name" value="${esc(t?.name||'')}" autocomplete="off"></label><label class="field">Year<input type="number" id="t-year" value="${esc(y0)}" min="1950" max="2100"></label></div>
  <div class="field">Stops <span class="muted" style="font-weight:400">Tap the places in the order you went. Tap again to take one out.</span><div class="quick-chips" id="t-places"></div></div>

  <div class="foot"><button class="btn" data-close>Cancel</button><button class="btn primary" id="t-save">Save trip</button></div>`,(el,close)=>{const q=s=>el.querySelector(s);
    const year=()=>{const y=+q('#t-year').value;return y>1900&&y<2101?y:null};
    const draw=()=>{const y=year(),has=p=>(p.years||[]).map(Number).includes(y);
      const list=[...visited].sort((a,b)=>(has(b)?1:0)-(has(a)?1:0)||a.name.localeCompare(b.name));
      q('#t-places').innerHTML=list.map(p=>{const i=sel.indexOf(p.id);return`<button type="button" class="qp ${i>=0?'sel':''}" data-p="${p.id}" aria-pressed="${i>=0}"><i>${i>=0?i+1:'+'}</i>${esc(p.name)}</button>`}).join('');
      q('#t-name').placeholder=sel.length?tripAutoName(sel.map(place),y):'e.g. Japan 2019'};
    q('#t-places').onclick=e=>{const b=e.target.closest('[data-p]');if(!b)return;const id=b.dataset.p;sel=sel.includes(id)?sel.filter(x=>x!==id):[...sel,id];draw()};
    q('#t-year').oninput=draw;draw();q('[data-close]').onclick=close;
    q('#t-save').onclick=async()=>{if(!sel.length){toast('Tap at least one place for this trip.');return}
      const y=year(),id=t?.id||uid(),doc={name:q('#t-name').value.trim()||tripAutoName(sel.map(place),y),year:y,placeIds:sel,note:q('#t-note').value.trim(),createdAt:t?.createdAt||Date.now()};
      q('#t-save').disabled=true;
      try{await B.setTrip(id,doc);if(!trip(id))S.trips.push({id,...doc});
        if(y)for(const p of sel.map(place))if(p&&!(p.years||[]).map(Number).includes(y))await savePlace(p.id,{years:[...(p.years||[]),y]});
        close();toast(t?'Trip saved':`${doc.name} added`);if(!t)confetti();selectTrip(id)}
      catch(e){q('#t-save').disabled=false;toast('Could not save the trip. Try again.')}}})}

/* ---------- modals ---------- */

  o.addEventListener('mousedown',e=>{if(e.target===o)closeModal(o)});$('#layer').appendChild(o);mount?.(o.firstElementChild,()=>closeModal(o));return o}
function closeModal(o){if(S.dict?.active?.())S.dict.stop().catch(()=>{});S.flushDraft?.();S.flushDraft=null;S.dictTarget=null;o.remove()}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){const l=$('.lightbox');if(l)return l.remove();const o=[...document.querySelectorAll('.overlay')].pop();if(o)closeModal(o)}});

function openAddPlace(opts={}){
  let status=opts.status||'visited';
  openModal(`<h2>Add a place</h2><p class="muted" style="margin:-8px 0 0">A city, or a whole country. Wonderbook finds it on the globe.</p>
  <div class="seg-toggle" id="ap-st"><button type="button" data-v="visited" aria-pressed="${status==='visited'}">I’ve been</button><button type="button" data-v="wishlist" aria-pressed="${status==='wishlist'}">I want to go</button></div>
  <div class="row2"><label class="field">City or country<input type="text" id="ap-name" placeholder="e.g. Kyoto" autocomplete="off"></label><label class="field">Country (optional)<input type="text" id="ap-country" value="${esc(opts.country||'')}" placeholder="e.g. Japan"></label></div>
  <label class="field" id="ap-yrs-f">Years visited<input type="text" id="ap-years" placeholder="e.g. 2019, 2024" inputmode="numeric"></label>
  <p class="muted" id="ap-msg" style="margin:0;min-height:1.5em"></p>
  <div class="list" id="ap-sugg"></div>
  <div class="foot"><button class="btn" data-close>Cancel</button><button class="btn primary" id="ap-go">Add place</button></div>`,(m,close)=>{
    const msg=m.querySelector('#ap-msg'),box=m.querySelector('#ap-sugg');let found=[],seq=0,timer=null;
    const yrs=()=>status==='visited'?(m.querySelector('#ap-years').value.match(/\d{4}/g)||[]).map(Number):[];
    const add=r=>{close();const f=countryForPoint(r.lng,r.lat)||G.features.find(x=>x.properties.name.toLowerCase()===String(r.country||'').toLowerCase());
      createPlace({status,years:yrs(),name:r.name,kind:r.kind==='country'?'country':'city',country:r.kind==='country'?r.name:(f?.properties.name||r.country||''),lat:r.lat,lng:r.lng,countryId:f?.id||null})};
